<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CBTS — Can't Beat The System</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;500&family=Crimson+Pro:ital,wght@0,300;0,400;0,600;1,300;1,400&display=swap');

:root {
  --bg: #0a0a0c;
  --bg-r: #08080b;
  --text: #c8c4b8;
  --dim: #6b6760;
  --bright: #e8e4d8;
  --lyric: #8a7e6a;
  --warm: #c4956a;
  --earth: #7a8a5a;
  --cold: #5a7a8a;
  --sys: #6a8aaa;
  --alert: #a65a4a;
  --inner: #c49090;
  --faint: #3a3530;
  --div: #1a1816;
  --card: #111110;
  --card-b: #1e1c18;
  --player: #8a7e6a;
  --heart-vital: #7a8a5a;
  --heart-fine: #c8c4b8;
  --heart-declining: #c4956a;
  --heart-critical: #a65a4a;
}

* { margin:0; padding:0; box-sizing:border-box; }

html, body {
  height: 100%;
  background: var(--bg);
  color: var(--text);
  font-family: 'Crimson Pro', serif;
  overflow: hidden;
}

/* ── LAYOUT ── */
.wrap {
  display: flex;
  height: calc(100vh - 90px);
  margin-top: 48px;
  width: 100%;
  overflow: hidden;
}

/* ── LEFT PANE ── */
.left {
  flex: 1;
  min-width: 0;
  overflow-y: auto;
  position: relative;
  border-right: 1px solid var(--div);
  scrollbar-width: thin;
  scrollbar-color: var(--faint) transparent;
  background-color: #0d0d10;
  background-image:
    linear-gradient(to bottom, rgba(90,75,50,.15) 0%, rgba(50,42,28,.06) 40%, transparent 70%);
}
.left::-webkit-scrollbar { width: 4px; }
.left::-webkit-scrollbar-thumb { background: var(--faint); border-radius: 2px; }

.left-bg {
  position: absolute;
  inset: 0;
  z-index: 0;
  pointer-events: none;
  opacity: 0.03;
  background-image: url("data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAADIAAAAyCAYAAAAeP4ixAAAABHNCSVQICAgIfAhkiAAAARlJREFUaIHt0LENwzAQBMD/J+YanMR1qAxX4jJUiMpwEYxhGBJF0tL9ADvAwh5xi+/rGwAAAAAAAAAAAAAAAGCffvYO/Kf3vQNnImJk5v7uoTNEEUtEnIiIvHfquxGxAAAAAAAAAAAAAAAAAAAAANibmXmIiMi79yIiTkTEwcf7EbGIiJWZi3unhoh4f/cOAAAAAAAAAAAAAAAAAPy/iJgj4nhErCLi+Nmpc0TEIiJOZuaBiIicc4iI+e6hM0TEYWYeJyLifO/UGSLikpnHiIi8e+9ExJyIWETEvlNfiIh5Zh4i4mBEvO8dOkNELDPzFBERd+9dRMxExImImO+eOsP3EwAAAAAAAAAAAAAAAAAA4E/5BStFbVGMnMaXAAAAAElFTkSuQmCC");
  background-size: 50px 50px;
  background-repeat: repeat;
}

.prose-wrap {
  position: relative;
  z-index: 2;
  max-width: 600px;
  margin: 0 auto;
  padding: 64px 48px 120px 48px;
}

/* ── TURN NAV (dev only) ── */
.turn-nav {
  display: flex;
  align-items: center;
  gap: 14px;
  margin-bottom: 8px;
}
.t-num {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 10px;
  letter-spacing: 4px;
  text-transform: uppercase;
  color: var(--dim);
  opacity: .4;
}
.t-btn {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 9px;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: var(--dim);
  opacity: .45;
  background: none;
  border: 1px solid var(--faint);
  border-radius: 2px;
  padding: 3px 9px;
  cursor: pointer;
  transition: all .3s;
}
.t-btn:hover { opacity: .6; color: var(--warm); border-color: var(--warm); }

.t-date {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 11px;
  letter-spacing: 3px;
  text-transform: uppercase;
  color: var(--text);
  opacity: .4;
  margin-bottom: 10px;
}

.t-title {
  font-family: 'Crimson Pro', serif;
  font-size: 36px;
  font-weight: 300;
  font-style: italic;
  color: var(--bright);
  margin-bottom: 40px;
  letter-spacing: -.3px;
  line-height: 1.2;
}

/* ── PROSE ── */
.prose { font-size: 19px; font-weight: 300; line-height: 1.78; color: var(--text); }
.prose p { margin-bottom: 26px; opacity: 0; animation: fadeUp 1s ease forwards; }
@keyframes fadeUp { from{opacity:0;transform:translateY(6px)} to{opacity:1;transform:translateY(0)} }

.lyric {
  font-style: italic;
  color: var(--lyric);
  margin: 32px 0;
  padding-left: 22px;
  border-left: 1px solid var(--faint);
  font-size: 19px;
  line-height: 1.72;
}
.inner {
  font-style: italic;
  color: var(--inner);
  margin: 32px 0;
  padding-left: 22px;
  border-left: 1px solid rgba(196,144,144,.2);
  font-size: 19px;
  line-height: 1.72;
}
.solo {
  margin: 40px 0;
  color: var(--bright);
  font-size: 19px;
}
.big { font-size: 24px; letter-spacing: 2px; font-style: normal; color: var(--bright); font-weight: 400; }
.time {
  font-family: 'Crimson Pro', serif;
  font-size: 36px;
  font-weight: 300;
  font-style: italic;
  color: var(--bright);
  letter-spacing: -.3px;
  line-height: 1.2;
  margin: 48px 0 40px;
}

/* ── QUESTION (standalone psychometric turn) ── */
.question-standalone {
  display: flex;
  flex-direction: column;
  justify-content: center;
  min-height: 50vh;
  padding: 40px 0;
}
.q-text-standalone {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 17px;
  line-height: 1.8;
  color: var(--text);
  margin-bottom: 40px;
  letter-spacing: .3px;
  opacity: 0;
  animation: fadeUp 1.2s ease forwards;
  animation-delay: .3s;
}
.q-opt {
  font-family: 'Crimson Pro', serif;
  font-size: 18px;
  font-weight: 300;
  color: var(--dim);
  padding: 16px 0;
  cursor: pointer;
  border-bottom: 1px solid rgba(26,24,22,.3);
  transition: all .35s;
  opacity: 0;
  animation: fadeUp .8s ease forwards;
}
.q-opt:nth-child(2) { animation-delay: .8s; }
.q-opt:nth-child(3) { animation-delay: 1.1s; }
.q-opt:nth-child(4) { animation-delay: 1.4s; }
.q-opt:last-child { border-bottom: none; }
.q-opt:hover { color: var(--warm); padding-left: 14px; }
.q-opt.sel { color: var(--warm); padding-left: 14px; }

/* ── CHOICES ── */
.choices {
  margin: 52px 0 44px;
  padding: 28px 26px;
  background: rgba(196,149,106,.03);
  border: 1px solid rgba(196,149,106,.12);
  border-radius: 4px;
}
.c-label {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 11px;
  letter-spacing: 3px;
  text-transform: uppercase;
  color: var(--warm);
  opacity: .5;
  margin-bottom: 8px;
}
.c-prompt {
  font-family: 'Crimson Pro', serif;
  font-size: 19px;
  font-style: italic;
  font-weight: 300;
  color: var(--text);
  margin-bottom: 22px;
  line-height: 1.5;
}
.c-opt {
  font-family: 'Crimson Pro', serif;
  font-size: 17px;
  font-weight: 300;
  color: var(--dim);
  padding: 13px 0;
  cursor: pointer;
  border-bottom: 1px solid rgba(26,24,22,.4);
  transition: all .35s;
}
.c-opt:last-child { border-bottom: none; }
.c-opt:hover { color: var(--warm); padding-left: 12px; }
.c-opt.sel { color: var(--warm); padding-left: 12px; }

/* ── ECONOMIC DISPLAY ── */
.econ-bar {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  height: 48px;
  background: rgba(6,6,9,.97);
  border-bottom: 1px solid var(--div);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 28px;
  z-index: 200;
  font-family: 'IBM Plex Mono', monospace;
  font-size: 12px;
  letter-spacing: 1px;
}
.econ-left {
  display: flex;
  align-items: center;
  gap: 32px;
}
.econ-item {
  display: flex;
  align-items: center;
  gap: 8px;
  color: var(--dim);
  opacity: .7;
  transition: opacity .3s;
}
.econ-item:hover { opacity: 1; }
.econ-label {
  font-size: 10px;
  letter-spacing: 3px;
  text-transform: uppercase;
  color: var(--text);
  opacity: .45;
}
.econ-val {
  font-size: 18px;
  color: var(--text);
  font-weight: 400;
}
.econ-val.cash { color: var(--earth); }
.econ-val.ds { color: var(--text); opacity: .7; }
.econ-val.bc { color: var(--sys); }
.econ-val.cw { color: var(--warm); }

/* ── HEALTH HEART ── */
.heart-icon {
  font-size: 22px;
  line-height: 1;
  animation: heartPulse 2s ease-in-out infinite;
}
.heart-icon.vital { color: var(--heart-vital); }
.heart-icon.fine { color: var(--heart-fine); animation-duration: 2.5s; }
.heart-icon.declining { color: var(--heart-declining); animation-duration: 3.5s; }
.heart-icon.critical { color: var(--heart-critical); animation-duration: 5s; opacity: .5; }
@keyframes heartPulse {
  0%, 100% { transform: scale(1); }
  15% { transform: scale(1.15); }
  30% { transform: scale(1); }
  45% { transform: scale(1.1); }
  60% { transform: scale(1); }
}

/* ── BC display (hidden until post-Event registration) ── */
.bc-display { display: none; }
.bc-display.visible { display: flex; }
/* ── CW display (hidden until T41) ── */
.cw-display { display: none; }
.cw-display.visible { display: flex; }

/* ── DEV NAV ── */
.dev-bar {
  display: flex;
  align-items: center;
  gap: 8px;
}
.dev-label {
  font-size: 8px;
  letter-spacing: 3px;
  text-transform: uppercase;
  color: var(--dim);
  opacity: .25;
}

/* ── RIGHT PANE ── */
.right {
  width: 50%;
  min-width: 360px;
  flex-shrink: 0;
  background: var(--bg-r);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.tabs {
  display: flex;
  padding: 14px 14px 0;
  margin-top: 6px;
  border-bottom: 1px solid var(--div);
  flex-shrink: 0;
}
.tab {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 12px;
  letter-spacing: 4px;
  text-transform: uppercase;
  padding: 12px 20px;
  color: var(--text);
  opacity: .5;
  cursor: pointer;
  border: none;
  border-bottom: 2px solid transparent;
  background: none;
  transition: all .3s;
}
.tab.on { opacity: 1; color: var(--warm); border-bottom-color: var(--warm); }
.tab:hover:not(.on) { opacity: .9; color: var(--bright); }
.tab .tab-count {
  font-size: 8px;
  opacity: .4;
  margin-left: 4px;
}

.panels {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  scrollbar-width: thin;
  scrollbar-color: var(--faint) transparent;
}
.panels::-webkit-scrollbar { width: 3px; }
.panels::-webkit-scrollbar-thumb { background: var(--faint); }

.panel { display: none; padding: 14px 12px 80px; }
.panel.on { display: block; }

/* ── SIGNAL CARDS ── */
.sec-label {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 11px;
  letter-spacing: 3px;
  text-transform: uppercase;
  color: var(--cold);
  opacity: .35;
  padding: 14px 4px 8px;
}
.card {
  background: var(--card);
  border: 1px solid var(--card-b);
  border-radius: 3px;
  padding: 12px 14px;
  margin-bottom: 5px;
  cursor: pointer;
  transition: all .3s;
}
.card:hover { background: #1a1814; border-color: var(--faint); }
.card.new { border-left: 2px solid var(--warm); animation: pulse 3s ease-in-out infinite; }
.card.fade { opacity: .28; }
@keyframes pulse { 0%,100%{border-left-color:var(--warm)} 50%{border-left-color:rgba(196,149,106,.15)} }

.card .src { font-family: 'IBM Plex Mono', monospace; font-size: 10px; letter-spacing: 2px; text-transform: uppercase; color: var(--dim); opacity: .45; margin-bottom: 5px; }
.card .ttl { font-family: 'Crimson Pro', serif; font-size: 16px; color: var(--text); line-height: 1.5; margin-bottom: 4px; }
.card .snip { font-family: 'Crimson Pro', serif; font-size: 15px; font-style: italic; color: var(--dim); line-height: 1.6; opacity: .6; }
.tag { display: inline-block; font-family: 'IBM Plex Mono', monospace; font-size: 10px; letter-spacing: 2px; text-transform: uppercase; padding: 2px 6px; margin-top: 7px; border-radius: 2px; background: rgba(196,149,106,.08); color: var(--warm); opacity: .6; }
.tag.c { background: rgba(90,122,138,.08); color: var(--cold); }
.tag.a { background: rgba(166,90,74,.15); color: var(--alert); }
.tag.e { background: rgba(122,138,90,.08); color: var(--earth); }
.save-signal { font-family: 'IBM Plex Mono', monospace; font-size: 9px; letter-spacing: 2px; text-transform: uppercase; color: var(--dim); opacity: .25; cursor: pointer; transition: all .3s; margin-top: 4px; padding: 2px 6px; display: inline-block; }
.save-signal:hover { opacity: .7; color: var(--warm); }
.save-signal.saved { color: var(--cold); opacity: .5; pointer-events: none; }

/* ── THREADS ── */
.tg { margin-bottom: 22px; }
.tg-label { font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: 3px; text-transform: uppercase; color: var(--cold); opacity: .45; margin-bottom: 9px; padding-bottom: 6px; border-bottom: 1px solid rgba(90,122,138,.1); }
a.ti, div.ti { font-family: 'Crimson Pro', serif; font-size: 15px; color: var(--dim); padding: 6px 0 6px 11px; border-left: 1px solid rgba(90,122,138,.14); margin-bottom: 3px; cursor: pointer; transition: all .3s; display: block; text-decoration: none; }
a.ti:hover, div.ti:hover { color: var(--text); border-left-color: var(--cold); }
a.ti.hot { color: var(--warm); border-left-color: rgba(196,149,106,.35); }
a.ti::after { content: ' ↗'; opacity: 0; transition: opacity .3s; font-size: 11px; }
a.ti:hover::after { opacity: .4; }
a.ti.player { color: var(--player); border-left-color: rgba(138,126,106,.2); }
a.ti.player:hover { color: var(--text); border-left-color: var(--player); }
a.ti.player::before { content: '— '; opacity: .3; font-size: 11px; }
div.ti.pending { cursor: default; opacity: .5; }

/* ── NOTES ── */
.note { background: rgba(196,149,106,.04); border: 1px solid rgba(196,149,106,.1); border-radius: 3px; padding: 13px 14px; margin-bottom: 9px; }
.note textarea { width: 100%; background: transparent; border: none; color: var(--text); font-family: 'Crimson Pro', serif; font-size: 16px; line-height: 1.7; resize: none; outline: none; min-height: 56px; }
.note textarea::placeholder { color: var(--dim); opacity: .3; font-style: italic; }
.note-t { font-family: 'IBM Plex Mono', monospace; font-size: 8px; letter-spacing: 2px; color: var(--dim); opacity: .28; margin-top: 7px; text-transform: uppercase; }
.note-actions { display: flex; gap: 12px; margin-top: 6px; }
.note-act { font-family: 'IBM Plex Mono', monospace; font-size: 8px; letter-spacing: 2px; text-transform: uppercase; color: var(--dim); opacity: 0; background: none; border: none; cursor: pointer; padding: 2px 0; transition: all .3s; }
.note:hover .note-act { opacity: .35; }
.note-act:hover { opacity: .7 !important; }
.note-act.del:hover { color: var(--alert); }
.note-act.keep:hover { color: var(--earth); }
.note-act.thread:hover { color: var(--cold); }
.thread-picker { display: none; margin-top: 6px; background: var(--card); border: 1px solid var(--card-b); border-radius: 3px; padding: 6px 0; }
.thread-picker.open { display: block; }
.thread-pick { display: block; width: 100%; text-align: left; font-family: 'IBM Plex Mono', monospace; font-size: 9px; letter-spacing: 1px; text-transform: uppercase; color: var(--dim); background: none; border: none; padding: 7px 12px; cursor: pointer; transition: all .2s; opacity: .55; }
.thread-pick:hover { opacity: 1; color: var(--cold); background: rgba(90,122,138,.06); }
.add-note { font-family: 'IBM Plex Mono', monospace; font-size: 9px; letter-spacing: 3px; text-transform: uppercase; color: var(--dim); opacity: .28; background: none; border: 1px dashed var(--faint); border-radius: 3px; padding: 13px; cursor: pointer; transition: all .3s; text-align: center; width: 100%; display: block; }
.add-note:hover { opacity: .6; border-color: var(--warm); color: var(--warm); }

/* ── SONGS ── */
.song {
  display: flex;
  gap: 12px;
  padding: 10px 12px;
  background: var(--card);
  border: 1px solid var(--card-b);
  border-radius: 3px;
  margin-bottom: 5px;
  cursor: pointer;
  transition: all .3s;
  align-items: flex-start;
}
.song:hover { background: #1a1814; border-color: var(--faint); }
.song-info { flex: 1; min-width: 0; }
.song-title { font-family: 'Crimson Pro', serif; font-size: 16px; color: var(--text); line-height: 1.4; }
.song-artist { font-family: 'IBM Plex Mono', monospace; font-size: 10px; letter-spacing: 2px; text-transform: uppercase; color: var(--dim); opacity: .45; margin-top: 2px; }
.song-context { font-family: 'Crimson Pro', serif; font-size: 14px; color: var(--dim); opacity: .55; margin-top: 5px; line-height: 1.5; font-style: italic; }
.song-turn { font-family: 'IBM Plex Mono', monospace; font-size: 8px; letter-spacing: 2px; text-transform: uppercase; color: var(--dim); opacity: .25; margin-top: 4px; }
.song.player .song-title { color: var(--player); }
.song-link { font-size: 28px; color: var(--warm); opacity: .6; flex-shrink: 0; padding-top: 4px; text-decoration: none; transition: opacity .3s; }
.song-link:hover { opacity: .8; }
.add-song { font-family: 'IBM Plex Mono', monospace; font-size: 9px; letter-spacing: 3px; text-transform: uppercase; color: var(--dim); opacity: .28; background: none; border: 1px dashed var(--faint); border-radius: 3px; padding: 13px; cursor: pointer; transition: all .3s; text-align: center; width: 100%; display: block; margin-top: 8px; }
.add-song:hover { opacity: .6; border-color: var(--warm); color: var(--warm); }
.ps-act { font-family: 'IBM Plex Mono', monospace; font-size: 9px; letter-spacing: 2px; text-transform: uppercase; color: var(--dim); opacity: .35; cursor: pointer; transition: all .3s; margin-right: 12px; }
.ps-act:hover { opacity: .7; color: var(--warm); }

/* ── DOOR OF LIGHT OVERLAY ── */
.dl-overlay {
  position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
  background: #000; z-index: 9999; overflow: hidden;
}
.dl-overlay video {
  position: absolute; bottom: 0; left: 0; width: 100%; height: 65%;
  object-fit: cover; object-position: center;
}
.dl-overlay .dl-fade {
  position: absolute; top: 0; left: 0; width: 100%; height: 100%;
  pointer-events: none;
  background: linear-gradient(to bottom,
    #000 0%, #000 25%, rgba(0,0,0,0.85) 32%,
    rgba(0,0,0,0.4) 40%, rgba(0,0,0,0.1) 48%, transparent 58%);
}
.dl-overlay .dl-prompt {
  position: absolute; top: 18%; left: 50%; transform: translateX(-50%);
  font-family: 'Quicksand', sans-serif; font-size: 38px; font-weight: 300;
  letter-spacing: 2px; color: rgba(220,195,160,0); white-space: nowrap;
  pointer-events: none; transition: color 2s ease, text-shadow 2s ease;
}
.dl-overlay .dl-prompt.visible {
  color: rgba(220,195,160,0.85);
  text-shadow: 0 0 40px rgba(255,220,160,0.2), 0 0 80px rgba(255,200,120,0.1);
}
.dl-overlay .dl-prompt.fade-out { color: rgba(220,195,160,0); text-shadow: none; }
.dl-overlay .dl-word {
  position: absolute; user-select: none; pointer-events: none;
  cursor: pointer; will-change: transform, opacity;
  font-family: 'Quicksand', sans-serif; font-weight: 300; letter-spacing: 1.5px;
}
.dl-overlay .dl-word.clickable { pointer-events: auto; }
.dl-overlay .dl-word.selected { filter: blur(0px) !important; }
.dl-overlay .dl-glow {
  position: absolute; bottom: 15%; left: 50%; transform: translateX(-50%);
  width: 140px; height: 220px; pointer-events: none;
  background: radial-gradient(ellipse at center, rgba(196,149,106,0.06) 0%, transparent 70%);
  animation: dlPulse 4s ease-in-out infinite;
}
@keyframes dlPulse { 0%,100% { opacity: 0.4; } 50% { opacity: 1; } }

/* ── NOISE OVERLAY ── */
.noise { position: fixed; inset: 0; background-color: transparent; background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.025'/%3E%3C/svg%3E"); pointer-events: none; z-index: 999; }

/* ── TICKER ── */
.ticker-bar {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  height: 42px;
  background: rgba(6,6,9,0.99);
  border-top: 1px solid var(--div);
  display: flex;
  align-items: center;
  z-index: 200;
  overflow: hidden;
}
.ticker-label {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 9px;
  letter-spacing: 3px;
  text-transform: uppercase;
  color: var(--warm);
  padding: 0 18px;
  flex-shrink: 0;
  opacity: 0.8;
  border-right: 1px solid var(--faint);
  height: 100%;
  display: flex;
  align-items: center;
}
.ticker-track {
  flex: 1;
  overflow: hidden;
  position: relative;
  height: 100%;
  display: flex;
  align-items: center;
}
.ticker-inner {
  display: flex;
  gap: 0;
  white-space: nowrap;
  animation: tickerScroll 75s linear infinite;
  font-family: 'IBM Plex Mono', monospace;
  font-size: 12px;
  color: var(--dim);
  letter-spacing: 0.4px;
}
.ticker-inner:hover { animation-play-state: paused; }
.t-item {
  padding: 0 32px;
  opacity: 0.5;
  transition: opacity 0.3s;
}
.t-item:hover { opacity: 0.9; color: var(--text); cursor: default; }
.t-item.warm { color: var(--warm); opacity: 0.6; }
.t-item.alert { color: var(--alert); opacity: 0.7; }
.t-item.cold { color: var(--cold); opacity: 0.5; }
.t-sep {
  opacity: 0.15;
  padding: 0 4px;
  color: var(--faint);
}
@keyframes tickerScroll {
  0%   { transform: translateX(0); }
  100% { transform: translateX(-50%); }
}

/* ── TICKER DEAD (event mode) ── */
.ticker-bar.dead .ticker-inner { animation: none; }
.ticker-bar.dead .ticker-label { color: var(--alert); opacity: .3; }
.ticker-bar.dead .t-item { display: none; }
.ticker-bar.dead::after {
  content: '';
  flex: 1;
}

/* ── RESPONSIVE ── */
@media (max-width: 900px) {
  .right { display: none; }
  .left { border-right: none; }
  .prose-wrap { padding: 64px 24px 120px; }
}

<script>
// ══════════════════════════════════════════════════════════
// CBTS ENGINE — Phase B: External JSON loader
// Loads play data from play1-simon.json
// All render logic identical to index-6 Phase A.
// ══════════════════════════════════════════════════════════

// ── STATE (initialised from JSON) ──
let state = {};
let playData = {};
let signalData = {};
let threadsData = [];
let songsData = [];
let tickerItems = [];

async function loadGame() {
  try {
    const resp = await fetch('play1-simon.json');
    if (!resp.ok) throw new Error('Failed to load play1-simon.json');
    const data = await resp.json();

    // Hydrate state from JSON initialState
    state = {
      play: 1,
      turnIndex: 0,
      ...JSON.parse(JSON.stringify(data.initialState)),
      choicesLog: [],
      questionsLog: [],
      notes: data.initialNotes ? JSON.parse(JSON.stringify(data.initialNotes)) : [],
      playerSongs: [],
      playerThreads: []
    };

    // Hydrate data
    playData = { turns: data.turns };
    signalData = data.signal || {};
    threadsData = data.threads || [];
    songsData = data.songs || [];
    tickerItems = data.ticker || [];

    // Init
    renderThreads();
    renderNotes();
    goTo(0);

  } catch (err) {
    console.error('CBTS load error:', err);
    document.getElementById('turn-content').innerHTML =
      '<p style="color:var(--alert)">Failed to load game data. Check console.</p>';
  }
}

// ══════════════════════════════════════════════════════
// ENGINE — identical to index-6
// ══════════════════════════════════════════════════════

function renderTurn(turnData) {
  const container = document.getElementById('turn-content');
  if (!turnData) {
    container.innerHTML = '<p style="color:var(--dim);font-style:italic">Turn not yet written.</p>';
    return;
  }

  let html = '';

  // ── DOOR OF LIGHT ──
  if (turnData.questionMode === 'door-of-light') {
    container.innerHTML = '';
    renderDoorOfLight(turnData);
    return;
  }

    // ── STANDALONE QUESTION TURN ──
  if (turnData.isQuestion) {
    html += '<div class="question-standalone">\n';
    html += `  <div class="q-text-standalone">${turnData.questionText}</div>\n`;
    const answered = state.questionsLog.find(ql => ql.id === turnData.id);
    turnData.questionOpts.forEach((o, i) => {
      const sel = answered && answered.chosen === i ? ' sel' : '';
      html += `  <div class="q-opt${sel}" data-qid="${turnData.id}" data-qi="${i}">${o.text}</div>\n`;
    });
    html += '</div>\n';
    container.innerHTML = html;
    // Bind question clicks
    container.querySelectorAll('.q-opt').forEach(opt => {
      if (opt.classList.contains('sel')) return;
      opt.addEventListener('click', function() {
        const qid = this.dataset.qid;
        const qi = parseInt(this.dataset.qi);
        if (turnData.questionOpts[qi].fx) applyEffects(turnData.questionOpts[qi].fx);
        state.questionsLog.push({ id: qid, chosen: qi, text: turnData.questionOpts[qi].text });
        this.closest('.question-standalone').querySelectorAll('.q-opt').forEach(o => {
          o.style.opacity = '.2';
          o.style.pointerEvents = 'none';
        });
        this.classList.add('sel');
        this.style.opacity = '1';
        setTimeout(() => goTo(state.turnIndex + 1), 1200);
      });
    });
    return;
  }

  // ── PROSE TURN ──
  turnData.paras.forEach(p => {
    const cls = p.c ? ` class="${p.c}"` : '';
    const sty = p.s ? ` style="${p.s}"` : '';
    html += `<p${cls}${sty}>${p.t}</p>\n`;
  });

  // Choices
  if (turnData.choices) {
    const chosen = state.choicesLog.find(cl => cl.turn === turnData.id);
    html += '<div class="choices">\n';
    html += `  <div class="c-label">${turnData.choices.label}</div>\n`;
    if (turnData.choices.prompt) {
      html += `  <div class="c-prompt">${turnData.choices.prompt}</div>\n`;
    }
    turnData.choices.opts.forEach((o, i) => {
      const sel = chosen && chosen.chosen === i ? ' sel' : '';
      const label = typeof o === 'string' ? o : o.text;
      html += `  <div class="c-opt${sel}" data-ci="${i}">${label}</div>\n`;
    });
    html += '</div>\n';
  } else if (!turnData.isQuestion) {
    // Default continue for turns without choices
    const alreadyContinued = state.choicesLog.find(cl => cl.turn === turnData.id);
    html += '<div class="choices">\n';
    html += '  <div class="c-label">Tempus fugit</div>\n';
    const sel = alreadyContinued ? ' sel' : '';
    html += `  <div class="c-opt${sel}" data-ci="0">Continue</div>\n`;
    html += '</div>\n';
  }

  // After-choices content
  if (turnData.after) {
    turnData.after.forEach(p => {
      const cls = p.c ? ` class="${p.c}"` : '';
      const sty = p.s ? ` style="${p.s}"` : '';
      html += `<p${cls}${sty}>${p.t}</p>\n`;
    });
  }

  container.innerHTML = html;

  // Bind choice clicks
  container.querySelectorAll('.choices .c-opt').forEach(opt => {
    if (opt.classList.contains('sel')) return;
    opt.addEventListener('click', function() {
      const ci = parseInt(this.dataset.ci);

      // Tempus fugit continue — no choices to process
      if (!turnData.choices) {
        state.choicesLog.push({ turn: turnData.id, chosen: 0, text: 'Continue' });
        this.classList.add('sel');
        setTimeout(() => goTo(state.turnIndex + 1), 900);
        return;
      }

      const choice = turnData.choices.opts[ci];
      const choiceText = typeof choice === 'string' ? choice : choice.text;
      if (choice.fx) applyEffects(choice.fx);
      if (choice.flag) {
        Object.assign(state.flags, choice.flag);
        if (choice.flag.registered) {
          state.bc = 1000;
          state.ds = 0;
        }
      }
      state.choicesLog.push({ turn: turnData.id, chosen: ci, text: choiceText });
      const choices = this.closest('.choices');
      choices.querySelectorAll('.c-opt').forEach(o => o.classList.remove('sel'));
      this.classList.add('sel');
      choices.querySelectorAll('.c-opt:not(.sel)').forEach(o => o.style.opacity = '.25');
      setTimeout(() => goTo(state.turnIndex + 1), 900);
    });
  });

  // Dynamic reveal pacing — short lines breathe faster
  let cumDelay = 0.5;
  container.querySelectorAll('p').forEach(p => {
    p.style.animation = 'none';
    p.style.opacity = '0';
    void p.offsetWidth;
    p.style.animation = `fadeUp 1.2s ease ${cumDelay}s forwards`;
    // Gap before NEXT paragraph based on THIS paragraph's length
    const len = p.textContent.length;
    let gap;
    if (len < 30) gap = 0.3;        // punchy one-liners
    else if (len < 80) gap = 0.5;   // short lines, dialogue
    else if (len < 200) gap = 0.8;  // medium paragraphs
    else if (len < 400) gap = 1.2;  // substantial paragraphs
    else gap = 1.6;                  // dense blocks — let them breathe
    cumDelay += gap;
  });
}

// ── DOOR OF LIGHT ──
function renderDoorOfLight(turnData) {
  // Remove any existing overlay
  const old = document.querySelector('.dl-overlay');
  if (old) old.remove();

  const words = turnData.doorWords || [];
  const maxSel = turnData.maxSelect || 5;
  const assets = turnData.assets || {};
  const promptText = turnData.questionText || '';

  const overlay = document.createElement('div');
  overlay.className = 'dl-overlay';
  overlay.innerHTML = `
    <video autoplay muted loop playsinline>
      <source src="${assets.video || 'door-loop.mp4'}" type="video/mp4">
    </video>
    <div class="dl-fade"></div>
    <div class="dl-glow"></div>
    <div class="dl-prompt">${promptText}</div>
    <div class="dl-field"></div>
  `;
  document.body.appendChild(overlay);

  const fieldEl = overlay.querySelector('.dl-field');
  fieldEl.style.cssText = 'position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;';
  const promptEl = overlay.querySelector('.dl-prompt');

  // Audio
  let audio = document.getElementById('dl-audio');
  if (!audio) {
    audio = document.createElement('audio');
    audio.id = 'dl-audio';
    audio.loop = true;
    audio.innerHTML = `<source src="${assets.audio || 'door-audio.mp3'}" type="audio/mpeg">`;
    document.body.appendChild(audio);
  }

  const COLOURS = [
    {r:255,g:248,b:235},{r:220,g:195,b:160},{r:186,g:155,b:120},
    {r:155,g:124,b:95},{r:200,g:180,b:155},{r:230,g:220,b:200},{r:170,g:140,b:100}
  ];
  const SEL_COL = {r:255,g:245,b:225};

  let selectedCount = 0;
  let resolved = false;
  const wordData = [];
  const placed = [];

  function tooClose(x, y, sz) {
    for (const p of placed) {
      if (Math.abs(x - p.x) < (sz + p.size) * 0.45 && Math.abs(y - p.y) < 2.8) return true;
    }
    return false;
  }

  // Build word elements
  words.forEach((word, i) => {
    const el = document.createElement('div');
    el.className = 'dl-word';
    el.textContent = word;
    const size = 13 + Math.random() * 24;
    el.style.fontSize = size + 'px';

    let x, y, att = 0;
    do { x = 6 + Math.random() * 84; y = 3 + Math.random() * 30; att++; }
    while (tooClose(x, y, size) && att < 50);
    placed.push({x, y, size});
    el.style.left = x + '%';
    el.style.top = y + '%';
    el.style.color = 'rgba(255,255,255,0)';
    el.style.textShadow = 'none';

    const col = COLOURS[Math.floor(Math.random() * COLOURS.length)];
    const wd = {
      el, word, selected: false, col,
      baseX: x, baseY: y,
      maxOpacity: 0.3 + Math.random() * 0.5,
      glowOpacity: 0.08 + Math.random() * 0.2,
      driftX: 0.8 + Math.random() * 1.5, driftY: 0.4 + Math.random() * 0.8,
      speedX: 0.0003 + Math.random() * 0.0004, speedY: 0.0002 + Math.random() * 0.0003,
      phaseX: Math.random() * Math.PI * 2, phaseY: Math.random() * Math.PI * 2,
      breathSpeed: 0.0004 + Math.random() * 0.0006, breathPhase: Math.random() * Math.PI * 2,
      breathMin: 0.85 + Math.random() * 0.1, breathMax: 1.05 + Math.random() * 0.15,
      blurBase: Math.random() * 0.8, blurRange: 0.3 + Math.random() * 1.2,
      blurSpeed: 0.0002 + Math.random() * 0.0004, blurPhase: Math.random() * Math.PI * 2,
      wobbleRange: 1.5 + Math.random() * 4, wobbleSpeed: 0.0001 + Math.random() * 0.0003,
      wobblePhase: Math.random() * Math.PI * 2,
      pulseSpeed: 0.0002 + Math.random() * 0.0005, pulsePhase: Math.random() * Math.PI * 2,
      pulseMin: 0.15 + Math.random() * 0.15,
      faded: false, drifting: false, fading: false, driftStart: 0, fadeStart: 0,
      driftFromX: 0, driftFromY: 0
    };

    el.addEventListener('click', () => {
      if (resolved) return;
      if (wd.selected) {
        wd.selected = false; el.classList.remove('selected'); selectedCount--;
        el.style.color = `rgba(${col.r},${col.g},${col.b},${wd.maxOpacity})`;
        el.style.textShadow = `0 0 25px rgba(${col.r},${col.g},${col.b},${wd.glowOpacity})`;
      } else {
        if (selectedCount >= maxSel) return;
        wd.selected = true; el.classList.add('selected'); selectedCount++;
        el.style.color = `rgba(${SEL_COL.r},${SEL_COL.g},${SEL_COL.b},0.95)`;
        el.style.textShadow = `0 0 30px rgba(255,220,160,0.6), 0 0 60px rgba(255,200,120,0.3), 0 0 100px rgba(255,180,80,0.15)`;
        if (selectedCount === maxSel) {
          const sel = wordData.filter(w => w.selected);
          sel.forEach(s => {
            s.el.style.color = 'rgba(255,255,255,1)';
            s.el.style.textShadow = '0 0 40px rgba(255,255,255,0.9), 0 0 80px rgba(255,230,180,0.6)';
          });
          setTimeout(() => {
            sel.forEach(s => {
              s.el.style.color = `rgba(${SEL_COL.r},${SEL_COL.g},${SEL_COL.b},0.95)`;
              s.el.style.textShadow = '0 0 30px rgba(255,220,160,0.6), 0 0 60px rgba(255,200,120,0.3)';
            });
            setTimeout(() => doResolve(), 600);
          }, 500);
        }
      }
    });

    fieldEl.appendChild(el);
    wordData.push(wd);
  });

  function doResolve() {
    resolved = true;
    wordData.forEach(w => w.el.classList.remove('clickable'));
    const now = performance.now();
    let si = 0;
    const chosen = [];
    wordData.forEach(w => {
      if (w.selected) {
        w.drifting = true; w.driftStart = now + si * 300; si++;
        const r = w.el.getBoundingClientRect();
        w.driftFromX = r.left + r.width / 2; w.driftFromY = r.top + r.height / 2;
        chosen.push(w.word);
      } else {
        w.fading = true; w.fadeStart = now + 400 + Math.random() * 1200;
      }
    });
    // Log to questionsLog
    state.questionsLog.push({ id: turnData.id, chosen: chosen, text: chosen.join(', ') });
    // Advance after animation
    setTimeout(() => {
      const dlAudio = document.getElementById('dl-audio');
      if (dlAudio) { dlAudio.pause(); dlAudio.remove(); }
      overlay.remove();
      goTo(state.turnIndex + 1);
    }, 4500);
  }

  // Sequence
  const startT = performance.now();
  setTimeout(() => {
    promptEl.classList.add('visible');
    audio.volume = 0; audio.play().catch(() => {});
    let vol = 0;
    const fi = setInterval(() => { vol += 0.02; if (vol >= 0.6) { vol = 0.6; clearInterval(fi); } audio.volume = vol; }, 80);
  }, 2000);
  setTimeout(() => promptEl.classList.add('fade-out'), 4500);
  setTimeout(() => {
    wordData.forEach((w, i) => {
      const delay = i * 120 + Math.random() * 300;
      setTimeout(() => {
        w.el.style.transition = 'color 2.5s ease, text-shadow 2.5s ease';
        w.el.style.color = `rgba(${w.col.r},${w.col.g},${w.col.b},${w.maxOpacity})`;
        w.el.style.textShadow = `0 0 25px rgba(${w.col.r},${w.col.g},${w.col.b},${w.glowOpacity})`;
        setTimeout(() => { w.el.style.transition = 'none'; w.faded = true; }, 2600);
      }, delay);
    });
    const lastDelay = words.length * 120 + 300 + 2600;
    setTimeout(() => wordData.forEach(w => w.el.classList.add('clickable')), lastDelay);
  }, 6700);

  // Animation loop
  let animId;
  function animate(ts) {
    if (!document.querySelector('.dl-overlay')) return; // overlay removed, stop
    wordData.forEach(w => {
      const t = ts - startT;
      if (w.drifting) {
        const elapsed = ts - w.driftStart;
        if (elapsed < 0) return;
        const progress = Math.min(elapsed / 3000, 1);
        const ease = 1 - Math.pow(1 - progress, 3);
        const tx = window.innerWidth * 0.5, ty = window.innerHeight * 0.58;
        const cx = w.driftFromX + (tx - w.driftFromX) * ease;
        const cy = w.driftFromY + (ty - w.driftFromY) * ease;
        let op = progress < 0.3 ? 0.95 : progress < 0.75 ? 0.95 * (1 - (progress - 0.3) / 0.45) : 0.95 * 0.05 * (1 - (progress - 0.75) / 0.25);
        const sc = 1 + progress * 0.3;
        w.el.style.position = 'fixed'; w.el.style.left = cx + 'px'; w.el.style.top = cy + 'px';
        w.el.style.transform = `translate(-50%,-50%) scale(${sc})`;
        w.el.style.color = `rgba(${SEL_COL.r},${SEL_COL.g},${SEL_COL.b},${op})`;
        w.el.style.filter = `blur(${progress * 2}px)`;
        if (progress >= 1) { w.el.style.display = 'none'; w.drifting = false; }
        return;
      }
      if (w.fading) {
        const elapsed = ts - w.fadeStart;
        if (elapsed >= 0) {
          const progress = Math.min(elapsed / 2000, 1);
          const op = w.maxOpacity * (1 - progress);
          w.el.style.color = `rgba(${w.col.r},${w.col.g},${w.col.b},${op})`;
          w.el.style.filter = `blur(${w.blurBase + progress * 3}px)`;
          if (progress >= 1) { w.el.style.display = 'none'; w.fading = false; }
          return;
        }
      }
      if (w.drifting || (w.fading && ts >= w.fadeStart)) return;
      // Normal float
      const oX = Math.sin(t * w.speedX + w.phaseX) * w.driftX;
      const oY = Math.cos(t * w.speedY + w.phaseY) * w.driftY;
      const sc = w.breathMin + (w.breathMax - w.breathMin) * (Math.sin(t * w.breathSpeed + w.breathPhase) * 0.5 + 0.5);
      const rot = Math.sin(t * w.wobbleSpeed + w.wobblePhase) * w.wobbleRange;
      const bl = w.blurBase + w.blurRange * (Math.sin(t * w.blurSpeed + w.blurPhase) * 0.5 + 0.5);
      w.el.style.transform = `translate(${oX}vw, ${oY}vh) scale(${sc}) rotate(${rot}deg)`;
      if (!w.selected) w.el.style.filter = `blur(${bl}px)`;
      if (w.faded && !w.selected) {
        const pt = Math.sin(t * w.pulseSpeed + w.pulsePhase) * 0.5 + 0.5;
        const op = w.pulseMin + (w.maxOpacity - w.pulseMin) * pt;
        w.el.style.color = `rgba(${w.col.r},${w.col.g},${w.col.b},${op})`;
      }
    });
    animId = requestAnimationFrame(animate);
  }
  animId = requestAnimationFrame(animate);
}

function applyEffects(fx) {
  for (const [key, val] of Object.entries(fx)) {
    if (key in state.profile) {
      state.profile[key] += val;
    }
  }
  console.log('AIDA Profile:', JSON.stringify(state.profile));
}

function renderSignal(turnId) {
  const panel = document.getElementById('signal-panel');
  const data = signalData[turnId];
  if (!data) {
    panel.innerHTML = '<div class="sec-label">\u2014 No signal this turn \u2014</div>';
    return;
  }
  let html = '';
  data.forEach(section => {
    html += `<div class="sec-label">\u2014 ${section.sec} \u2014</div>`;
    section.cards.forEach(card => {
      const newCls = card.isnew ? ' new' : '';
      html += `<div class="card${newCls}">
        <div class="src">${card.src}</div>
        <div class="ttl">${card.ttl}</div>
        <div class="snip">${card.snip}</div>
        <div class="tag ${card.cls}">${card.tag}</div>
        <div class="save-signal" data-ttl="${(card.ttl||'').replace(/"/g,'&quot;')}" data-src="${(card.src||'').replace(/"/g,'&quot;')}" data-snip="${(card.snip||'').replace(/"/g,'&quot;')}">Save to notes</div>
      </div>`;
    });
  });
  panel.innerHTML = html;

  // Card interactions
  panel.querySelectorAll('.card').forEach(card => {
    card.addEventListener('click', function(e) {
      if (e.target.classList.contains('save-signal')) return;
      if (this.classList.contains('new')) this.classList.remove('new');
      else this.classList.toggle('fade');
    });
  });
  panel.querySelectorAll('.save-signal').forEach(btn => {
    btn.addEventListener('click', function(e) {
      e.stopPropagation();
      const turn = playData.turns[state.turnIndex];
      addNote(`${this.dataset.src}: ${this.dataset.ttl}`, `Signal \u2014 ${turn.num}`, true);
      this.textContent = 'Saved';
      this.classList.add('saved');
    });
  });
}

function renderThreads() {
  const panel = document.getElementById('threads-panel');
  let html = '';
  threadsData.forEach(group => {
    const visibleItems = group.items.filter(item => {
      if (!item.turn) return true;
      const turnIdx = playData.turns.findIndex(t => t.id === item.turn);
      return turnIdx <= state.turnIndex;
    });
    if (visibleItems.length === 0) return;
    html += `<div class="tg"><div class="tg-label">${group.label}</div>`;
    visibleItems.forEach(item => {
      if (item.url) {
        const cls = item.src === 'player' ? 'ti player' : 'ti';
        html += `<a class="${cls}" href="${item.url}" target="_blank" rel="noopener">${item.text}</a>`;
      } else {
        html += `<div class="ti pending">${item.text}</div>`;
      }
    });
    html += '</div>';
  });
  panel.innerHTML = html;
}

function renderNotes() {
  const panel = document.getElementById('notes-panel');
  let html = '';
  state.notes.forEach((note, i) => {
    // Skip initialNotes that haven't been reached yet
    if (note.turn !== undefined) {
      const turnIdx = playData.turns.findIndex(t => t.id === note.turn);
      if (turnIdx > state.turnIndex) return;
    }
    const ro = note.readonly ? ' readonly style="opacity:.6"' : '';
    html += `<div class="note" data-ni="${i}">
      <textarea${ro}>${note.text}</textarea>
      <div class="note-t">${note.timestamp}</div>
      <div class="note-actions">
        <button class="note-act del">Delete</button>
        <button class="note-act keep">Keep</button>
        <button class="note-act thread">Save to thread</button>
      </div>
    </div>`;
  });
  html += '<button class="add-note" id="addNote">+ Add note</button>';
  panel.innerHTML = html;
  bindNoteActions();
}

function addNote(text, timestamp, readonly = false) {
  if (!timestamp) {
    const turn = playData.turns[state.turnIndex];
    timestamp = turn && turn.date ? turn.date : '';
  }
  state.notes.push({ text, timestamp, readonly });
  renderNotes();
}

function bindNoteActions() {
  document.querySelectorAll('.note .del').forEach(btn => {
    btn.addEventListener('click', function() {
      if (this.dataset.confirm) {
        const idx = parseInt(this.closest('.note').dataset.ni);
        state.notes.splice(idx, 1);
        renderNotes();
      } else {
        this.dataset.confirm = '1';
        this.textContent = 'Sure?';
        this.style.opacity = '.7';
        this.style.color = 'var(--alert)';
        setTimeout(() => {
          if (this.parentElement) {
            delete this.dataset.confirm;
            this.textContent = 'Delete';
            this.style.opacity = '';
            this.style.color = '';
          }
        }, 3000);
      }
    });
  });

  document.querySelectorAll('.note .keep').forEach(btn => {
    btn.addEventListener('click', function() {
      const idx = parseInt(this.closest('.note').dataset.ni);
      state.notes[idx].kept = true;
      const note = this.closest('.note');
      note.style.borderColor = 'rgba(122,138,90,.25)';
      this.textContent = 'Kept';
      this.style.opacity = '.7';
      this.style.color = 'var(--earth)';
      this.style.pointerEvents = 'none';
    });
  });

  document.querySelectorAll('.note .thread').forEach(btn => {
    btn.addEventListener('click', function(e) {
      e.stopPropagation();
      const note = this.closest('.note');
      const textarea = note.querySelector('textarea');
      const txt = textarea ? textarea.value.trim() : '';
      if (!txt) return;
      document.querySelectorAll('.thread-picker.open').forEach(p => p.remove());
      const picker = document.createElement('div');
      picker.className = 'thread-picker open';
      threadsData.forEach((group, gi) => {
        const pickBtn = document.createElement('button');
        pickBtn.className = 'thread-pick';
        pickBtn.textContent = group.label;
        pickBtn.addEventListener('click', (ev) => {
          ev.stopPropagation();
          const urlMatch = txt.match(/https?:\/\/[^\s]+/);
          const newItem = {
            text: urlMatch ? txt.replace(urlMatch[0], '').trim() || urlMatch[0] : txt,
            url: urlMatch ? urlMatch[0] : null,
            src: 'player',
            turn: playData.turns[state.turnIndex] ? playData.turns[state.turnIndex].id : 0
          };
          threadsData[gi].items.push(newItem);
          renderThreads();
          picker.remove();
          const threadBtn = note.querySelector('.thread');
          if (threadBtn) {
            threadBtn.textContent = 'Saved';
            threadBtn.style.opacity = '.7';
            threadBtn.style.color = 'var(--cold)';
            threadBtn.style.pointerEvents = 'none';
          }
          note.style.transition = 'opacity .4s';
          note.style.opacity = '.2';
        });
        picker.appendChild(pickBtn);
      });
      note.appendChild(picker);
    });
  });

  const addBtn = document.getElementById('addNote');
  if (addBtn) {
    addBtn.addEventListener('click', () => {
      addNote('', 'Just now', false);
      const notes = document.querySelectorAll('.note textarea');
      if (notes.length) notes[notes.length - 1].focus();
    });
  }
}

// Close thread pickers when clicking elsewhere
document.addEventListener('click', function(e) {
  if (!e.target.classList.contains('thread') && !e.target.classList.contains('thread-pick')) {
    document.querySelectorAll('.thread-picker.open').forEach(p => p.remove());
  }
});

function renderSongs() {
  const panel = document.getElementById('songs-panel');
  const currentTurn = playData.turns[state.turnIndex];
  const visible = songsData.filter(s => {
    const turnIdx = playData.turns.findIndex(t => t.id === s.turn);
    return turnIdx <= state.turnIndex;
  }).sort((a, b) => {
    const ai = playData.turns.findIndex(t => t.id === a.turn);
    const bi = playData.turns.findIndex(t => t.id === b.turn);
    return ai - bi;
  });

  let html = '';
  if (visible.length > 0) {
    html += '<div style="font-family:\'IBM Plex Mono\',monospace;font-size:9px;letter-spacing:2px;text-transform:uppercase;color:var(--warm);opacity:.4;margin-bottom:16px;padding-bottom:8px;border-bottom:1px solid rgba(196,149,106,.1)"><a href="https://open.spotify.com" target="_blank" rel="noopener" style="color:var(--warm);text-decoration:none">&#9835; Open in Spotify</a></div>';
  }
  visible.forEach(song => {
    const linkHtml = song.url
      ? `<a class="song-link" href="${song.url}" target="_blank" rel="noopener">\u266b</a>`
      : '';
    html += `<div class="song${song.src === 'player' ? ' player' : ''}">
      <div class="song-info">
        <div class="song-title">${song.title}</div>
        <div class="song-artist">${song.artist}</div>
        <div class="song-context">${song.context}</div>
        <div class="song-turn">T${song.turn}</div>
      </div>
      ${linkHtml}
    </div>`;
  });

  if (state.playerSongs.length > 0) {
    html += '<div style="font-family:\'IBM Plex Mono\',monospace;font-size:9px;letter-spacing:2px;text-transform:uppercase;color:var(--warm);opacity:.4;margin:24px 0 16px;padding:12px 0 8px;border-top:1px solid rgba(196,149,106,.1)">Your songs</div>';
  }

  state.playerSongs.forEach((song, si) => {
    const linkHtml = song.url
      ? `<a class="song-link" href="${song.url}" target="_blank" rel="noopener">\u266b</a>`
      : '';
    const addLinkBtn = !song.url
      ? `<span class="ps-act ps-link" data-si="${si}">+ Add Spotify link</span>`
      : '';
    html += `<div class="song player">
      <div class="song-info">
        <div class="song-title">${song.title}</div>
        <div class="song-artist">${song.artist || ''}</div>
        ${song.notes ? `<div class="song-context">${song.notes}</div>` : ''}
        <div class="song-turn">Added by player</div>
        <div style="margin-top:6px">${addLinkBtn}<span class="ps-act ps-del" data-si="${si}">Delete</span></div>
      </div>
      ${linkHtml}
    </div>`;
  });

  html += '<button class="add-song" id="addSong">+ Add a song</button>';
  panel.innerHTML = html;

  // Bind add-link buttons
  panel.querySelectorAll('.ps-link').forEach(btn => {
    btn.addEventListener('click', function() {
      const si = parseInt(this.dataset.si);
      const url = prompt('Spotify link:');
      if (url) {
        state.playerSongs[si].url = url;
        renderSongs();
      }
    });
  });

  // Bind delete buttons with confirmation
  panel.querySelectorAll('.ps-del').forEach(btn => {
    btn.addEventListener('click', function() {
      const si = parseInt(this.dataset.si);
      if (this.dataset.confirm) {
        state.playerSongs.splice(si, 1);
        renderSongs();
      } else {
        this.dataset.confirm = '1';
        this.textContent = 'Sure?';
        this.style.color = 'var(--alert)';
        setTimeout(() => {
          if (this.parentElement) {
            delete this.dataset.confirm;
            this.textContent = 'Delete';
            this.style.color = '';
          }
        }, 3000);
      }
    });
  });

  document.getElementById('addSong').addEventListener('click', () => {
    const title = prompt('Song title:');
    if (title) {
      const artist = prompt('Artist:');
      const notes = prompt('Why this song? (optional):');
      const url = prompt('Spotify link (optional):');
      state.playerSongs.push({
        title,
        artist: artist || '',
        notes: notes || '',
        url: url || ''
      });
      renderSongs();
    }
  });
}

function updateEconDisplay() {
  const turn = playData.turns[state.turnIndex];
  const turnId = turn ? turn.id : 1;
  document.getElementById('cashVal').textContent = '\u00a3' + state.cash.toLocaleString();
  document.getElementById('heart').className = 'heart-icon ' + state.health;

  const dsWrap = document.getElementById('dsWrap');
  if (state.flags.registered) {
    dsWrap.style.display = 'none';
  } else {
    dsWrap.style.display = 'flex';
    document.getElementById('dsVal').textContent = '\u00a3' + state.ds.toLocaleString();
  }

  const bcWrap = document.getElementById('bcWrap');
  if (state.flags.registered && state.bc > 0) {
    bcWrap.classList.add('visible');
    document.getElementById('bcVal').textContent = state.bc.toLocaleString() + ' BC';
  } else {
    bcWrap.classList.remove('visible');
  }

  const cwWrap = document.getElementById('cwWrap');
  if (state.cw.visible) {
    cwWrap.classList.add('visible');
    document.getElementById('cwVal').textContent = state.cw.value;
  } else {
    cwWrap.classList.remove('visible');
  }
}

function updateTicker(turnId) {
  const ticker = document.getElementById('ticker');
  const inner = document.getElementById('ticker-inner');
  if (turnId === 21) {
    ticker.classList.add('dead');
    inner.innerHTML = '';
    return;
  }
  ticker.classList.remove('dead');
  const all = [...tickerItems, ...tickerItems];
  inner.innerHTML = all.map(item =>
    `<span class="t-item ${item.cls}">${item.text}</span><span class="t-sep">\u25c6</span>`
  ).join('');
}

// ── NAVIGATION ──
function goTo(idx) {
  if (idx < 0 || idx >= playData.turns.length) return;
  state.turnIndex = idx;
  const turn = playData.turns[idx];
  const titleEl = document.getElementById('t-title');
  const dateEl = document.getElementById('t-date');
  const numEl = document.getElementById('t-num');

  if (turn.isQuestion) {
    titleEl.style.display = 'none';
    dateEl.style.display = 'none';
    numEl.textContent = '';
  } else {
    titleEl.style.display = '';
    dateEl.style.display = '';
    numEl.textContent = turn.num;
    titleEl.textContent = turn.title;
    dateEl.textContent = turn.date;
  }

  renderTurn(turn);
  renderSignal(turn.isQuestion ? null : turn.id);
  renderSongs();
  renderThreads();
  renderNotes();
  updateEconDisplay();
  updateTicker(turn.isQuestion ? null : turn.id);
  // Clean up Door of Light overlay if navigating away
  const dlOverlay = document.querySelector('.dl-overlay');
  if (dlOverlay) dlOverlay.remove();
  const dlAudio = document.getElementById('dl-audio');
  if (dlAudio) { dlAudio.pause(); dlAudio.remove(); }
    document.querySelector('.left').scrollTop = 0;
}

// ── TAB SWITCHING ──
document.querySelectorAll('.tab').forEach(tab => {
  tab.addEventListener('click', function() {
    const p = this.dataset.p;
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('on'));
    document.querySelectorAll('.panel').forEach(el => el.classList.remove('on'));
    this.classList.add('on');
    document.querySelector('.panel[data-p="' + p + '"]').classList.add('on');
  });
});

// ── DEV NAV ──
document.getElementById('prev').addEventListener('click', () => goTo(state.turnIndex - 1));
document.getElementById('next').addEventListener('click', () => goTo(state.turnIndex + 1));

// ── KEYBOARD NAV (dev) ──
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'TEXTAREA' || e.target.tagName === 'INPUT') return;
  if (e.key === 'ArrowLeft') goTo(state.turnIndex - 1);
  if (e.key === 'ArrowRight') goTo(state.turnIndex + 1);
});

// ── TEXTAREA AUTO-RESIZE ──
document.addEventListener('input', function(e) {
  if (e.target.tagName === 'TEXTAREA') {
    e.target.style.height = 'auto';
    e.target.style.height = e.target.scrollHeight + 'px';
  }
});

// ── BOOT ──
loadGame();

</script>
</body>
</html>
