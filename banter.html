<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Banter</title>
<meta property="og:title" content="Banter">
<meta property="og:description" content="Two men in a pub imagine the future of everything.">
<meta property="og:type" content="website">
<meta property="og:image" content="https://teeser2026.github.io/cant-beat-the-system/afterhours.webp">
<meta property="og:image:alt" content="After Hours">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://teeser2026.github.io/cant-beat-the-system/afterhours.webp">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Spectral:ital,wght@0,300;0,400;0,500;0,600;1,400;1,500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
body{margin:0;background:#0c0a08;color:#b8b0a8;font-family:'Spectral',Georgia,serif;-webkit-font-smoothing:antialiased;overflow-x:hidden}

:root{
  --bg:#0c0a08;
  --tx:#b8b0a8;
  --txl:#7a7268;
  --txh:#e8e2da;
  --ac:#aa7a4a;
  --acl:#c49a5a;
  --abl:rgba(196,154,92,.10);
}

.page-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  min-height:100vh;
  max-width:1200px;
  margin:0 auto;
}
.column{
  display:flex;
  flex-direction:column;
  border-right:1px solid var(--abl);
}
.column:last-child{border-right:none}

.col-image{
  position:relative;
  width:100%;
  aspect-ratio:4/5;
  max-height:60vh;
  overflow:hidden;
}
.col-image img{
  display:block;
  width:100%;
  height:100%;
  object-fit:cover;
  opacity:.45;
}
.col-image.ah img{object-position:center 35%}

.col-header{
  position:absolute;
  top:33%;
  left:0;right:0;
  transform:translateY(-50%);
  text-align:center;
  padding:0 32px;
  z-index:2;
}
.col-label{
  font-family:'IBM Plex Mono',monospace;
  font-size:10px;font-weight:500;
  letter-spacing:.2em;text-transform:uppercase;
  color:var(--ac);
  margin:0 0 10px;
  text-shadow:0 1px 8px rgba(0,0,0,.6);
}
.col-title{
  font-family:'Spectral',serif;font-weight:500;
  font-size:30px;line-height:1.12;letter-spacing:-.01em;
  color:var(--txh);margin:0 0 8px;
  text-shadow:0 1px 12px rgba(0,0,0,.7);
}
.col-sub{
  font-family:'Spectral',serif;font-style:italic;
  font-size:14px;line-height:1.4;
  color:var(--tx);margin:0;
  text-shadow:0 1px 8px rgba(0,0,0,.6);
}

.col-links{
  list-style:none;padding:0 32px;margin:0;
  flex:1;
  padding-top:16px;
}
.col-links li{
  border-top:1px solid var(--abl);
}
.col-links li:first-child{border-top:none}
.col-links a{
  display:block;
  padding:14px 0;
  text-decoration:none;
  color:inherit;
  transition:padding-left .12s ease;
}
.col-links a:hover{padding-left:8px}
.col-links a:hover .link-title{color:var(--acl)}
.link-title{
  font-family:'Spectral',serif;font-weight:500;
  font-size:16px;line-height:1.25;
  color:var(--txh);margin:0 0 3px;
  transition:color .12s ease;
}
.link-sub{
  font-family:'IBM Plex Mono',monospace;
  font-size:10px;line-height:1.4;
  color:var(--txl);
}

.page-header{
  grid-column:1/-1;
  padding:20px 32px 12px;
  border-bottom:1px solid var(--abl);
}
.header-text{
  font-family:'IBM Plex Mono',monospace;
  font-size:11px;font-weight:500;
  letter-spacing:.18em;text-transform:uppercase;
  color:var(--txl);
}

.page-footer{
  grid-column:1/-1;
  padding:16px 32px;
  border-top:1px solid var(--abl);
}
.footer-text{
  font-family:'IBM Plex Mono',monospace;
  font-size:10px;letter-spacing:.12em;color:var(--txl);
}

@media(max-width:768px){
  .page-grid{
    grid-template-columns:1fr;
    min-height:auto;
  }
  .column{border-right:none;border-bottom:1px solid var(--abl)}
  .column:last-child{border-bottom:none}
  .col-image{aspect-ratio:3/4;max-height:none}
  .col-header{padding:0 24px}
  .col-title{font-size:26px}
  .col-links{padding:0 24px;padding-top:16px}
  .link-title{font-size:15px}
  .page-footer{padding:16px 24px}
}
</style>
</head>
<body>

<div class="page-grid">

  <header class="page-header">
    <span class="header-text">Banter</span>
  </header>

  <!-- ═══ After Hours ═══ -->
  <div class="column">
    <div class="col-image ah">
      <img src="afterhours.webp" alt="">
      <div class="col-header">
        <div class="col-label">January 2027</div>
        <h1 class="col-title">After Hours</h1>
        <p class="col-sub">Two men in a pub imagine the future of everything</p>
      </div>
    </div>
    <ul class="col-links">
      <li><a href="Anthropomorphic_Mode.html" target="_blank">
        <div class="link-title">Anthropomorphic Mode</div>
        <div class="link-sub">Smart meters, kitchen surveillance, and a washing machine with feelings.</div>
      </a></li>
    </ul>
  </div>

  <footer class="page-footer">
    <span class="footer-text">January 2027</span>
  </footer>

</div>

</body>
</html>
