top\">Face ID, fingerprint, voice, behavioural<\u002Ftd><td style=\"font-size:13.5px;line-height:1.55;color:#5f594b;padding:13px 16px 13px 0;border-bottom:1px solid rgba(124,45,36,.13);vertical-align:top\">Default on consumer devices. Voluntary adoption.<\u002Ftd><td style=\"font-size:14px;color:#4f493e;padding:13px 0;border-bottom:1px solid rgba(124,45,36,.13);vertical-align:top\">N/A<\u002Ftd><\u002Ftr>\n            <tr><td style=\"font-size:14px;color:#7c2d24;font-weight:500;padding:13px 16px 13px 0;border-bottom:1px solid rgba(124,45,36,.13);vertical-align:top\">Device-level ID<\u002Ftd><td style=\"font-size:15px;color:#2b271f;font-weight:500;padding:13px 16px 13px 0;border-bottom:1px solid rgba(124,45,36,.13);vertical-align:top\">Apple iOS\u00a026.4 age verification (UK)<\u002Ftd><td style=\"font-size:13.5px;line-height:1.55;color:#5f594b;padding:13px 16px 13px 0;border-bottom:1px solid rgba(124,45,36,.13);vertical-align:top\">Live since March 2026. Google Android confirmed soon.<\u002Ftd><td style=\"font-size:14px;color:#4f493e;padding:13px 0;border-bottom:1px solid rgba(124,45,36,.13);vertical-align:top\">N/A \u2014 pushed via OS update.<\u002Ftd><\u002Ftr>\n            <tr><td style=\"font-size:14px;color:#7c2d24;font-weight:500;padding:13px 16px 13px 0;border-bottom:1px solid rgba(124,45,36,.13);vertical-align:top\">Legal framework<\u002Ftd><td style=\"font-size:15px;color:#2b271f;font-weight:500;padding:13px 16px 13px 0;border-bottom:1px solid rgba(124,45,36,.13);vertical-align:top\">Data (Use and Access) Act 2025 + DVS Trust Framework v1.0 + Online Safety Act<\u002Ftd><td style=\"font-size:13.5px;line-height:1.55;color:#5f594b;padding:13px 16px 13px 0;border-bottom:1px solid rgba(124,45,36,.13);vertical-align:top\">Live. Secretary of State can update DVS rules by ministerial order.<\u002Ftd><td style=\"font-size:14px;color:#4f493e;padding:13px 0;border-bottom:1px solid rgba(124,45,36,.13);vertical-align:top\">N/A<\u002Ftd><\u002Ftr>\n          <\u002Ftbody>\n        <\u002Ftable>\n      <\u002Fdiv>\n      <div style=\"display:flex;align-items:center;gap:12px;margin:0 0 18px\"><span style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:#7c2d24\">The silent enrolment<\u002Fspan><span style=\"flex:1;height:1px;background:rgba(124,45,36,.22)\"><\u002Fspan><\u002Fdiv>\n      <div style=\"overflow-x:auto;margin:0 0 32px\">\n        <table style=\"width:100%;min-width:880px;border-collapse:collapse;font-family:'Spectral',serif\">\n          <thead><tr>\n            <th style=\"text-align:left;font-family:'IBM Plex Mono',monospace;font-size:10px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:#9c7268;padding:0 16px 11px 0;border-bottom:1.5px solid #7c2d24;width:22%\">Mandate<\u002Fth>\n            <th style=\"text-align:left;font-family:'IBM Plex Mono',monospace;font-size:10px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:#9c7268;padding:0 16px 11px 0;border-bottom:1.5px solid #7c2d24;width:24%\">Method<\u002Fth>\n            <th style=\"text-align:left;font-family:'IBM Plex Mono',monospace;font-size:10px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:#9c7268;padding:0 16px 11px 0;border-bottom:1.5px solid #7c2d24\">Public response<\u002Fth>\n            <th style=\"text-align:left;font-family:'IBM Plex Mono',monospace;font-size:10px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:#9c7268;padding:0 0 11px 0;border-bottom:1.5px solid #7c2d24\">Outcome<\u002Fth>\n          <\u002Ftr><\u002Fthead>\n          <tbody>\n            <tr><td style=\"font-size:14.5px;color:#2b271f;font-weight:500;padding:13px 16px 13px 0;border-bottom:1px solid rgba(124,45,36,.13);vertical-align:top\">Online Safety Act (2023\u201325)<\u002Ftd><td style=\"font-size:13.5px;line-height:1.5;color:#4f493e;padding:13px 16px 13px 0;border-bottom:1px solid rgba(124,45,36,.13);vertical-align:top\">Age verification: credit card, passport, selfie<\u002Ftd><td style=\"font-size:13.5px;line-height:1.5;color:#5f594b;padding:13px 16px 13px 0;border-bottom:1px solid rgba(124,45,36,.13);vertical-align:top\">VPN usage surged. Workarounds, not removal.<\u002Ftd><td style=\"font-size:13.5px;line-height:1.5;color:#5f594b;padding:13px 0;border-bottom:1px solid rgba(124,45,36,.13);vertical-align:top\">90+ Ofcom investigations, \u00a31.8M+ fines. Architecture stays.<\u002Ftd><\u002Ftr>\n            <tr><td style=\"font-size:14.5px;color:#2b271f;font-weight:500;padding:13px 16px 13px 0;border-bottom:1px solid rgba(124,45,36,.13);vertical-align:top\">Right-to-Work Digital ID (Sep 2025)<\u002Ftd><td style=\"font-size:13.5px;line-height:1.5;color:#4f493e;padding:13px 16px 13px 0;border-bottom:1px solid rgba(124,45,36,.13);vertical-align:top\">Mandatory digital ID for employment<\u002Ftd><td style=\"font-size:13.5px;line-height:1.5;color:#5f594b;padding:13px 16px 13px 0;border-bottom:1px solid rgba(124,45,36,.13);vertical-align:top\">3M signed a petition<\u002Ftd><td style=\"font-size:13.5px;line-height:1.5;color:#5f594b;padding:13px 0;border-bottom:1px solid rgba(124,45,36,.13);vertical-align:top\">\"Mandatory\" dropped. \"Convenience\" framing. Architecture unchanged.<\u002Ftd><\u002Ftr>\n            <tr><td style=\"font-size:14.5px;color:#2b271f;font-weight:500;padding:13px 16px 13px 0;border-bottom:1px solid rgba(124,45,36,.13);vertical-align:top\">Companies House (Nov 2025)<\u002Ftd><td style=\"font-size:13.5px;line-height:1.5;color:#4f493e;padding:13px 16px 13px 0;border-bottom:1px solid rgba(124,45,36,.13);vertical-align:top\">One Login verification for 6\u20137M directors / PSCs<\u002Ftd><td style=\"font-size:13.5px;line-height:1.5;color:#5f594b;padding:13px 16px 13px 0;border-bottom:1px solid rgba(124,45,36,.13);vertical-align:top\">No opt-out. No exemption. No alternative route.<\u002Ftd><td style=\"font-size:13.5px;line-height:1.5;color:#5f594b;padding:13px 0;border-bottom:1px solid rgba(124,45,36,.13);vertical-align:top\">Criminal offence for non-compliance by Nov 2026. Unlimited fines, director disqualification up to 15 years, company strike-off. De facto mandatory digital ID \u2014 while the government publicly claims digital ID is voluntary.<\u002Ftd><\u002Ftr>\n            <tr><td style=\"font-size:14.5px;color:#2b271f;font-weight:500;padding:13px 16px 13px 0;border-bottom:1px solid rgba(124,45,36,.13);vertical-align:top\">Social Media Ban (15 June 2026)<\u002Ftd><td style=\"font-size:13.5px;line-height:1.5;color:#4f493e;padding:13px 16px 13px 0;border-bottom:1px solid rgba(124,45,36,.13);vertical-align:top\">Facial recognition + digital IDs<\u002Ftd><td style=\"font-size:13.5px;line-height:1.5;color:#5f594b;padding:13px 16px 13px 0;border-bottom:1px solid rgba(124,45,36,.13);vertical-align:top\">~70% public support<\u002Ftd><td style=\"font-size:13.5px;line-height:1.5;color:#5f594b;padding:13px 0;border-bottom:1px solid rgba(124,45,36,.13);vertical-align:top\">Infrastructure normalised as \"child protection.\"<\u002Ftd><\u002Ftr>\n            <tr><td style=\"font-size:14.5px;color:#2b271f;font-weight:500;padding:13px 16px 13px 0;border-bottom:1px solid rgba(124,45,36,.13);vertical-align:top\">Immigration compliance<\u002Ftd><td style=\"font-size:13.5px;line-height:1.5;color:#4f493e;padding:13px 16px 13px 0;border-bottom:1px solid rgba(124,45,36,.13);vertical-align:top\">Digital ID for benefits, housing, employment<\u002Ftd><td style=\"font-size:13.5px;line-height:1.5;color:#5f594b;padding:13px 16px 13px 0;border-bottom:1px solid rgba(124,45,36,.13);vertical-align:top\">No large-scale backlash<\u002Ftd><td style=\"font-size:13.5px;line-height:1.5;color:#5f594b;padding:13px 0;border-bottom:1px solid rgba(124,45,36,.13);vertical-align:top\">System expanded without significant debate.<\u002Ftd><\u002Ftr>\n            <tr><td style=\"font-size:14.5px;color:#2b271f;font-weight:500;padding:13px 16px 13px 0;border-bottom:1px solid rgba(124,45,36,.13);vertical-align:top\">Apple iOS\u00a026.4 (Mar 2026)<\u002Ftd><td style=\"font-size:13.5px;line-height:1.5;color:#4f493e;padding:13px 16px 13px 0;border-bottom:1px solid rgba(124,45,36,.13);vertical-align:top\">ID scan, credit card, or account history check<\u002Ftd><td style=\"font-size:13.5px;line-height:1.5;color:#5f594b;padding:13px 16px 13px 0;border-bottom:1px solid rgba(124,45,36,.13);vertical-align:top\">Feature appeared in beta \u2014 Apple said it was \u201can error\u201d and withdrew it. Then shipped it anyway.<\u002Ftd><td style=\"font-size:13.5px;line-height:1.5;color:#5f594b;padding:13px 0;border-bottom:1px solid rgba(124,45,36,.13);vertical-align:top\">Device locked down to minor mode if unverified. Ofcom \u201ccelebrated\u201d the move.<\u002Ftd><\u002Ftr>\n            <tr><td style=\"font-size:14.5px;color:#2b271f;font-weight:500;padding:13px 16px 13px 0;border-bottom:1px solid rgba(124,45,36,.13);vertical-align:top\">Device-level mandate (8 June 2026)<\u002Ftd><td style=\"font-size:13.5px;line-height:1.5;color:#4f493e;padding:13px 16px 13px 0;border-bottom:1px solid rgba(124,45,36,.13);vertical-align:top\">OS-level blocking of nude images across all apps<\u002Ftd><td style=\"font-size:13.5px;line-height:1.5;color:#5f594b;padding:13px 16px 13px 0;border-bottom:1px solid rgba(124,45,36,.13);vertical-align:top\">Three-month deadline for compliance<\u002Ftd><td style=\"font-size:13.5px;line-height:1.5;color:#5f594b;padding:13px 0;border-bottom:1px solid rgba(124,45,36,.13);vertical-align:top\">Fines or criminal liability for tech executives. Legislation to compel if companies don\u2019t act.<\u002Ftd><\u002Ftr>\n            <tr><td style=\"font-size:14.5px;color:#2b271f;font-weight:500;padding:13px 16px 13px 0;border-bottom:1px solid rgba(124,45,36,.13);vertical-align:top\">Anthropic privacy policy update (July 2026)<\u002Ftd><td style=\"font-size:13.5px;line-height:1.5;color:#4f493e;padding:13px 16px 13px 0;border-bottom:1px solid rgba(124,45,36,.13);vertical-align:top\">Age and identity verification for Claude AI users<\u002Ftd><td style=\"font-size:13.5px;line-height:1.5;color:#5f594b;padding:13px 16px 13px 0;border-bottom:1px solid rgba(124,45,36,.13);vertical-align:top\">\u2014<\u002Ftd><td style=\"font-size:13.5px;line-height:1.5;color:#5f594b;padding:13px 0;border-bottom:1px solid rgba(124,45,36,.13);vertical-align:top\">The tool used to compile this document is implementing identity verification on its own users.<\u002Ftd><\u002Ftr>\n          <\u002Ftbody>\n        <\u002Ftable>\n      <\u002Fdiv>\n      <div style=\"max-width:680px\">\n        <p style=\"font-family:'Spectral',serif;font-size:18.5px;line-height:1.78;color:#4f493e;margin:0 0 26px\">The pattern: the public objects briefly, then complies. The architecture stays.<\u002Fp>\n        <p class=\"tis-statement\" style=\"font-family:'Spectral',serif;font-weight:500;font-size:22px;line-height:1.55;color:#2b271f;margin:0\">The government's own consultation on the social media ban offers no option to reject the identity verification infrastructure \u2014 only options about what age the ban should apply from. Every answer on the form presupposes the architecture.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <div aria-hidden=\"true\" style=\"position:relative;z-index:2;height:58px;margin:0 auto;max-width:1080px;background:url(&quot;a23bab68.webp&quot;) center/cover;opacity:.5;-webkit-mask-image:linear-gradient(90deg,transparent,#000 24%,#000 76%,transparent);mask-image:linear-gradient(90deg,transparent,#000 24%,#000 76%,transparent)\"><\u002Fdiv>\n\n  <!-- ============ LAYER 08 ============ -->\n  <section id=\"L8\" data-layer=\"7\" data-screen-label=\"08 Vulnerability\" style=\"position:relative;z-index:2;padding:120px 0\">\n    <div class=\"tis-wrap\" style=\"max-width:1040px;margin:0 auto;padding:0 64px\">\n      <div>\n        <div style=\"font-family:'IBM Plex Mono',monospace;font-size:13px;letter-spacing:.16em;color:#7c2d24\">08<span style=\"color:#a59b89\"> / 12<\u002Fspan><\u002Fdiv>\n        <div style=\"width:42px;height:2px;background:#7c2d24;margin:14px 0 16px\"><\u002Fdiv>\n        <h2 class=\"tis-h-title\" style=\"font-family:'Spectral',serif;font-weight:500;font-size:46px;line-height:1.06;letter-spacing:-.012em;color:#2b271f;margin:0 0 18px\">Structural vulnerability<\u002Fh2>\n        <p style=\"font-family:'Spectral',serif;font-style:italic;font-size:21px;line-height:1.5;color:#6b6453;margin:0 0 36px;max-width:52ch\">Interoperability removes containment by design.<\u002Fp>\n      <\u002Fdiv>\n      <p style=\"font-family:'Spectral',serif;font-size:18.5px;line-height:1.78;color:#4f493e;margin:0 0 22px;max-width:680px\">When systems are siloed, a breach is contained. Your NHS data doesn't reach the police database. Your financial records don't reach the MoD. Interoperability removes that containment. That's the point of it \u2014 and the danger.<\u002Fp>\n      <p style=\"font-family:'Spectral',serif;font-size:18.5px;line-height:1.78;color:#4f493e;margin:0 0 38px;max-width:680px\">The same architecture that allows \"seamless data sharing\" means that corrupted, stolen, or falsified data travels across every connected system. Every node in the chain is a way in to the whole thing.<\u002Fp>\n      <div style=\"display:flex;align-items:center;gap:12px;margin:0 0 18px\"><span style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:#7c2d24\">Known real-world failures<\u002Fspan><span style=\"flex:1;height:1px;background:rgba(124,45,36,.22)\"><\u002Fspan><\u002Fdiv>\n      <div style=\"overflow-x:auto;margin:0 0 38px\">\n        <table style=\"width:100%;min-width:880px;border-collapse:collapse;font-family:'Spectral',serif\">\n          <thead><tr>\n            <th style=\"text-align:left;font-family:'IBM Plex Mono',monospace;font-size:10px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:#9c7268;padding:0 16px 11px 0;border-bottom:1.5px solid #7c2d24;width:24%\">Incident<\u002Fth>\n            <th style=\"text-align:left;font-family:'IBM Plex Mono',monospace;font-size:10px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:#9c7268;padding:0 16px 11px 0;border-bottom:1.5px solid #7c2d24;width:11%\">Date<\u002Fth>\n            <th style=\"text-align:left;font-family:'IBM Plex Mono',monospace;font-size:10px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:#9c7268;padding:0 16px 11px 0;border-bottom:1.5px solid #7c2d24;width:22%\">Scale<\u002Fth>\n            <th style=\"text-align:left;font-family:'IBM Plex Mono',monospace;font-size:10px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:#9c7268;padding:0 0 11px 0;border-bottom:1.5px solid #7c2d24\">Notes<\u002Fth>\n          <\u002Ftr><\u002Fthead>\n          <tbody>\n            <tr><td style=\"font-size:15px;color:#2b271f;font-weight:500;padding:13px 16px 13px 0;border-bottom:1px solid rgba(124,45,36,.13);vertical-align:top\">Essex Police LFR misconfiguration<\u002Ftd><td style=\"font-size:14px;color:#4f493e;padding:13px 16px 13px 0;border-bottom:1px solid rgba(124,45,36,.13);vertical-align:top\">2025<\u002Ftd><td style=\"font-size:13.5px;line-height:1.5;color:#5f594b;padding:13px 16px 13px 0;border-bottom:1px solid rgba(124,45,36,.13);vertical-align:top\">2.5M faces scanned with wrong algorithm settings \u2014 borrowed from a different vendor<\u002Ftd><td style=\"font-size:13.5px;line-height:1.55;color:#5f594b;padding:13px 0;border-bottom:1px solid rgba(124,45,36,.13);vertical-align:top\">Caught by external civil society researchers, not internal audit. Not by NEC. Not by the Home Office. ICO investigation opened.<\u002Ftd><\u002Ftr>\n            <tr><td style=\"font-size:15px;color:#2b271f;font-weight:500;padding:13px 16px 13px 0;border-bottom:1px solid rgba(124,45,36,.13);vertical-align:top\">Discord age-verification breach<\u002Ftd><td style=\"font-size:14px;color:#4f493e;padding:13px 16px 13px 0;border-bottom:1px solid rgba(124,45,36,.13);vertical-align:top\">Oct 2025<\u002Ftd><td style=\"font-size:13.5px;line-height:1.5;color:#5f594b;padding:13px 16px 13px 0;border-bottom:1px solid rgba(124,45,36,.13);vertical-align:top\">~70,000 users' government ID photographs exposed<\u002Ftd><td style=\"font-size:13.5px;line-height:1.55;color:#5f594b;padding:13px 0;border-bottom:1px solid rgba(124,45,36,.13);vertical-align:top\">Breach at third-party verification vendor. Structural consequence of systems designed to collect more than they need.<\u002Ftd><\u002Ftr>\n            <tr><td style=\"font-size:15px;color:#2b271f;font-weight:500;padding:13px 16px 13px 0;border-bottom:1px solid rgba(124,45,36,.13);vertical-align:top\">NHS FDP contract redaction<\u002Ftd><td style=\"font-size:14px;color:#4f493e;padding:13px 16px 13px 0;border-bottom:1px solid rgba(124,45,36,.13);vertical-align:top\">Nov 2023<\u002Ftd><td style=\"font-size:13.5px;line-height:1.5;color:#5f594b;padding:13px 16px 13px 0;border-bottom:1px solid rgba(124,45,36,.13);vertical-align:top\">417/586 pages of \u00a3330M contract redacted<\u002Ftd><td style=\"font-size:13.5px;line-height:1.55;color:#5f594b;padding:13px 0;border-bottom:1px solid rgba(124,45,36,.13);vertical-align:top\">Content remains unknown. Parliamentary and FOI scrutiny ongoing.<\u002Ftd><\u002Ftr>\n            <tr><td style=\"font-size:15px;color:#2b271f;font-weight:500;padding:13px 16px 13px 0;border-bottom:1px solid rgba(124,45,36,.13);vertical-align:top\">Passport database searches<\u002Ftd><td style=\"font-size:14px;color:#4f493e;padding:13px 16px 13px 0;border-bottom:1px solid rgba(124,45,36,.13);vertical-align:top\">2024<\u002Ftd><td style=\"font-size:13.5px;line-height:1.5;color:#5f594b;padding:13px 16px 13px 0;border-bottom:1px solid rgba(124,45,36,.13);vertical-align:top\">45M+ images<\u002Ftd><td style=\"font-size:13.5px;line-height:1.55;color:#5f594b;padding:13px 0;border-bottom:1px solid rgba(124,45,36,.13);vertical-align:top\">Police forces conducted FRT searches against the passport database without a specific public consent framework.<\u002Ftd><\u002Ftr>\n          <\u002Ftbody>\n        <\u002Ftable>\n      <\u002Fdiv>\n      <div style=\"display:flex;align-items:center;gap:12px;margin:0 0 18px\"><span style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:#7c2d24\">How one breach becomes systemic<\u002Fspan><span style=\"flex:1;height:1px;background:rgba(124,45,36,.22)\"><\u002Fspan><\u002Fdiv>\n      <div style=\"overflow-x:auto;margin:0 0 36px\">\n        <table style=\"width:100%;min-width:840px;border-collapse:collapse;font-family:'Spectral',serif\">\n          <thead><tr>\n            <th style=\"text-align:left;font-family:'IBM Plex Mono',monospace;font-size:10px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:#9c7268;padding:0 16px 11px 0;border-bottom:1.5px solid #7c2d24;width:24%\">Entry point<\u002Fth>\n            <th style=\"text-align:left;font-family:'IBM Plex Mono',monospace;font-size:10px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:#9c7268;padding:0 16px 11px 0;border-bottom:1.5px solid #7c2d24;width:34%\">Direct exposure<\u002Fth>\n            <th style=\"text-align:left;font-family:'IBM Plex Mono',monospace;font-size:10px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:#9c7268;padding:0 0 11px 0;border-bottom:1.5px solid #7c2d24\">Where it spreads<\u002Fth>\n          <\u002Ftr><\u002Fthead>\n          <tbody>\n            <tr><td style=\"font-size:14.5px;color:#2b271f;font-weight:500;padding:13px 16px 13px 0;border-bottom:1px solid rgba(124,45,36,.13);vertical-align:top\">NEC facial recognition database<\u002Ftd><td style=\"font-size:13.5px;line-height:1.5;color:#4f493e;padding:13px 16px 13px 0;border-bottom:1px solid rgba(124,45,36,.13);vertical-align:top\">16.5M facial records, 13+ forces<\u002Ftd><td style=\"font-size:13.5px;line-height:1.5;color:#7c2d24;padding:13px 0;border-bottom:1px solid rgba(124,45,36,.13);vertical-align:top\">Via Palantir ontology to NHS, MoD, FCA, Home Office<\u002Ftd><\u002Ftr>\n            <tr><td style=\"font-size:14.5px;color:#2b271f;font-weight:500;padding:13px 16px 13px 0;border-bottom:1px solid rgba(124,45,36,.13);vertical-align:top\">Palantir Foundry<\u002Ftd><td style=\"font-size:13.5px;line-height:1.5;color:#4f493e;padding:13px 16px 13px 0;border-bottom:1px solid rgba(124,45,36,.13);vertical-align:top\">Cross-referenced health, defence, financial, policing data<\u002Ftd><td style=\"font-size:13.5px;line-height:1.5;color:#7c2d24;padding:13px 0;border-bottom:1px solid rgba(124,45,36,.13);vertical-align:top\">Up to 240 NHS orgs, 10+ government departments<\u002Ftd><\u002Ftr>\n            <tr><td style=\"font-size:14.5px;color:#2b271f;font-weight:500;padding:13px 16px 13px 0;border-bottom:1px solid rgba(124,45,36,.13);vertical-align:top\">GOV.UK Wallet<\u002Ftd><td style=\"font-size:13.5px;line-height:1.5;color:#4f493e;padding:13px 16px 13px 0;border-bottom:1px solid rgba(124,45,36,.13);vertical-align:top\">Driving licence, DBS, veteran cards, all credentials by 2027<\u002Ftd><td style=\"font-size:13.5px;line-height:1.5;color:#7c2d24;padding:13px 0;border-bottom:1px solid rgba(124,45,36,.13);vertical-align:top\">Every DVS trust framework service<\u002Ftd><\u002Ftr>\n            <tr><td style=\"font-size:14.5px;color:#2b271f;font-weight:500;padding:13px 16px 13px 0;border-bottom:1px solid rgba(124,45,36,.13);vertical-align:top\">Oracle backend (IAM)<\u002Ftd><td style=\"font-size:13.5px;line-height:1.5;color:#4f493e;padding:13px 16px 13px 0;border-bottom:1px solid rgba(124,45,36,.13);vertical-align:top\">Authentication across 800+ public sector organisations<\u002Ftd><td style=\"font-size:13.5px;line-height:1.5;color:#7c2d24;padding:13px 0;border-bottom:1px solid rgba(124,45,36,.13);vertical-align:top\">Every department relying on Oracle for identity and access<\u002Ftd><\u002Ftr>\n            <tr><td style=\"font-size:14.5px;color:#2b271f;font-weight:500;padding:13px 16px 13px 0;border-bottom:1px solid rgba(124,45,36,.13);vertical-align:top\">Integration layer (Accenture / AWS)<\u002Ftd><td style=\"font-size:13.5px;line-height:1.5;color:#4f493e;padding:13px 16px 13px 0;border-bottom:1px solid rgba(124,45,36,.13);vertical-align:top\">Connection points between Palantir, NHS, government cloud<\u002Ftd><td style=\"font-size:13.5px;line-height:1.5;color:#7c2d24;padding:13px 0;border-bottom:1px solid rgba(124,45,36,.13);vertical-align:top\">Bypasses front-end verification entirely<\u002Ftd><\u002Ftr>\n          <\u002Ftbody>\n        <\u002Ftable>\n      <\u002Fdiv>\n      <p class=\"tis-statement\" style=\"font-family:'Spectral',serif;font-weight:500;font-size:24px;line-height:1.5;letter-spacing:-.006em;color:#2b271f;margin:0 0 36px;max-width:760px\">What makes the system powerful is what makes it fragile.<br>A breach anywhere becomes a breach everywhere.<\u002Fp>\n      <p style=\"font-family:'Spectral',serif;font-size:18.5px;line-height:1.78;color:#4f493e;margin:0 0 36px;max-width:680px\">Device-level verification adds another dimension to the chain. Apple and Google now hold identity-linked device profiles for every UK user who verifies. These are accessible via legal requests \u2014 RIPA warrants, court orders, national security letters. Once every device carries a verified age profile, authorities gain a direct route to identify any user through the company that made their phone.<\u002Fp>\n      <div style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;line-height:1.7;color:#a59b89;border-top:1px solid rgba(90,78,55,.22);padding-top:14px\">Sources&nbsp;&nbsp;Essex Police suspension, 2025 \u00b7 Big Brother Watch \u00b7 ICO investigation \u00b7 Parliamentary POST, Apr 2026<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <div aria-hidden=\"true\" style=\"position:relative;z-index:2;height:58px;margin:0 auto;max-width:1080px;background:url(&quot;a23bab68.webp&quot;) center/cover;opacity:.5;-webkit-mask-image:linear-gradient(90deg,transparent,#000 24%,#000 76%,transparent);mask-image:linear-gradient(90deg,transparent,#000 24%,#000 76%,transparent)\"><\u002Fdiv>\n\n  <!-- ============ LAYER 09 ============ -->\n  <section id=\"L9\" data-layer=\"8\" data-screen-label=\"09 The black box\" style=\"position:relative;z-index:2;padding:120px 0\">\n    <div class=\"tis-wrap\" style=\"max-width:920px;margin:0 auto;padding:0 64px\">\n      <div>\n        <div style=\"font-family:'IBM Plex Mono',monospace;font-size:13px;letter-spacing:.16em;color:#7c2d24\">09<span style=\"color:#a59b89\"> / 12<\u002Fspan><\u002Fdiv>\n        <div style=\"width:42px;height:2px;background:#7c2d24;margin:14px 0 16px\"><\u002Fdiv>\n        <h2 class=\"tis-h-title\" style=\"font-family:'Spectral',serif;font-weight:500;font-size:46px;line-height:1.06;letter-spacing:-.012em;color:#2b271f;margin:0 0 18px\">The black box<\u002Fh2>\n      <\u002Fdiv>\n      <div style=\"position:relative;width:100%;margin:6px 0 38px;border-radius:3px;overflow:hidden;background:#15120e url(&quot;b5318033.webp&quot;) center/cover;box-shadow:0 28px 60px -30px rgba(20,12,4,.8)\">\n        <div style=\"position:absolute;inset:0;background:linear-gradient(150deg,rgba(8,6,4,.66),rgba(8,6,4,.32) 55%,rgba(8,6,4,.6))\"><\u002Fdiv>\n        <div style=\"position:relative;padding:66px 58px;min-height:380px;display:flex;flex-direction:column;justify-content:center\">\n          <div style=\"font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.28em;text-transform:uppercase;color:#c75a4a;margin:0 0 24px\">The black box<\u002Fdiv>\n          <p style=\"font-family:'Spectral',serif;font-weight:500;font-size:40px;line-height:1.18;letter-spacing:-.012em;color:#f4efe6;margin:0;max-width:none\">The infrastructure is public.<br>The coordination is not.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <p style=\"font-family:'Spectral',serif;font-size:18.5px;line-height:1.78;color:#4f493e;margin:0 0 32px;max-width:680px\">The contracts are on record.<br>The legislation is published.<br>What isn't public is the coordination behind it.<\u002Fp>\n      <div style=\"overflow-x:auto;margin:0 0 32px\">\n        <table style=\"width:100%;min-width:760px;border-collapse:collapse;font-family:'Spectral',serif\">\n          <thead><tr>\n            <th style=\"text-align:left;font-family:'IBM Plex Mono',monospace;font-size:10px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:#9c7268;padding:0 16px 11px 0;border-bottom:1.5px solid #7c2d24;width:12%\">Date<\u002Fth>\n            <th style=\"text-align:left;font-family:'IBM Plex Mono',monospace;font-size:10px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:#9c7268;padding:0 16px 11px 0;border-bottom:1.5px solid #7c2d24\">Event<\u002Fth>\n            <th style=\"text-align:left;font-family:'IBM Plex Mono',monospace;font-size:10px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:#9c7268;padding:0 0 11px 0;border-bottom:1.5px solid #7c2d24;width:30%\">FOI outcome<\u002Fth>\n          <\u002Ftr><\u002Fthead>\n          <tbody>\n            <tr><td style=\"font-size:13.5px;color:#7c2d24;font-weight:500;padding:13px 16px 13px 0;border-bottom:1px solid rgba(124,45,36,.13);vertical-align:top;white-space:nowrap\">17 Oct 2024<\u002Ftd><td style=\"font-size:14.5px;line-height:1.55;color:#3f3a30;padding:13px 16px 13px 0;border-bottom:1px solid rgba(124,45,36,.13);vertical-align:top\">PM meets Bill Gates and Larry Fink (CEO, BlackRock) at Downing Street. PM publicly referenced the meeting on social media.<\u002Ftd><td style=\"font-size:13px;line-height:1.5;color:#5f594b;padding:13px 0;border-bottom:1px solid rgba(124,45,36,.13);vertical-align:top\"><span style=\"color:#7c2d24;font-weight:500\">Refused.<\u002Fspan> \u00a727 (International Relations), \u00a735 (Safe Space for Policy Making), \u00a743 (Commercial Interests).<\u002Ftd><\u002Ftr>\n            <tr><td style=\"font-size:13.5px;color:#7c2d24;font-weight:500;padding:13px 16px 13px 0;border-bottom:1px solid rgba(124,45,36,.13);vertical-align:top;white-space:nowrap\">Oct 2024<\u002Ftd><td style=\"font-size:14.5px;line-height:1.55;color:#3f3a30;padding:13px 16px 13px 0;border-bottom:1px solid rgba(124,45,36,.13);vertical-align:top\">PM meets Mark Carney \u2014 former Bank of England Governor, digital-currency advocate, now PM of Canada.<\u002Ftd><td style=\"font-size:13px;line-height:1.5;color:#5f594b;padding:13px 0;border-bottom:1px solid rgba(124,45,36,.13);vertical-align:top\"><span style=\"color:#7c2d24;font-weight:500\">Refused.<\u002Fspan> Same exemptions.<\u002Ftd><\u002Ftr>\n            <tr><td style=\"font-size:13.5px;color:#7c2d24;font-weight:500;padding:13px 16px 13px 0;border-bottom:1px solid rgba(124,45,36,.13);vertical-align:top;white-space:nowrap\">27 Feb 2025<\u002Ftd><td style=\"font-size:14.5px;line-height:1.55;color:#3f3a30;padding:13px 16px 13px 0;border-bottom:1px solid rgba(124,45,36,.13);vertical-align:top\">PM visits Palantir's Washington HQ with Peter Mandelson. Mandelson's consultancy firm Global Counsel was a Palantir client.<\u002Ftd><td style=\"font-size:13px;line-height:1.5;color:#5f594b;padding:13px 0;border-bottom:1px solid rgba(124,45,36,.13);vertical-align:top\"><span style=\"color:#7c2d24;font-weight:500\">No minutes taken.<\u002Fspan><\u002Ftd><\u002Ftr>\n            <tr><td style=\"font-size:13.5px;color:#7c2d24;font-weight:500;padding:13px 16px 13px 0;border-bottom:1px solid rgba(124,45,36,.13);vertical-align:top;white-space:nowrap\">Feb 2026<\u002Ftd><td style=\"font-size:14.5px;line-height:1.55;color:#3f3a30;padding:13px 16px 13px 0;border-bottom:1px solid rgba(124,45,36,.13);vertical-align:top\">Mandelson resigns from House of Lords following Epstein file disclosures.<\u002Ftd><td style=\"font-size:13px;line-height:1.5;color:#5f594b;padding:13px 0;border-bottom:1px solid rgba(124,45,36,.13);vertical-align:top\">\u2014<\u002Ftd><\u002Ftr>\n          <\u002Ftbody>\n        <\u002Ftable>\n      <\u002Fdiv>\n      <p style=\"font-family:'Spectral',serif;font-size:18.5px;line-height:1.78;color:#4f493e;margin:0 0 36px;max-width:680px\">The world's largest asset manager, the world's most prominent digital-health-infrastructure advocate, and a former central banker all had private conversations with the PM whose government is building this stack. The public is legally barred from knowing what was discussed.<\u002Fp>\n      <p class=\"tis-statement\" style=\"font-family:'Spectral',serif;font-weight:500;font-size:24px;line-height:1.5;letter-spacing:-.006em;color:#2b271f;margin:0 0 36px;max-width:52ch\">The state doesn't need to hide the infrastructure \u2014 it's all in procurement records and legislation. What it hides is the intent and the coordination.<\u002Fp>\n      <div style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;line-height:1.7;color:#a59b89;border-top:1px solid rgba(90,78,55,.22);padding-top:14px\">Sources&nbsp;&nbsp;WhatDoTheyKnow FOI records \u00b7 Hansard \u00b7 courage.media investigation, May 2025<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <div aria-hidden=\"true\" style=\"position:relative;z-index:2;height:58px;margin:0 auto;max-width:1080px;background:url(&quot;a23bab68.webp&quot;) center/cover;opacity:.5;-webkit-mask-image:linear-gradient(90deg,transparent,#000 24%,#000 76%,transparent);mask-image:linear-gradient(90deg,transparent,#000 24%,#000 76%,transparent)\"><\u002Fdiv>\n\n  <!-- ============ LAYER 10 ============ -->\n  <section id=\"L10\" data-layer=\"9\" data-screen-label=\"10 The alternatives\" style=\"position:relative;z-index:2;padding:120px 0\">\n    <div class=\"tis-wrap\" style=\"max-width:1040px;margin:0 auto;padding:0 64px\">\n      <div>\n        <div style=\"font-family:'IBM Plex Mono',monospace;font-size:13px;letter-spacing:.16em;color:#7c2d24\">10<span style=\"color:#a59b89\"> / 12<\u002Fspan><\u002Fdiv>\n        <div style=\"width:42px;height:2px;background:#7c2d24;margin:14px 0 16px\"><\u002Fdiv>\n        <h2 class=\"tis-h-title\" style=\"font-family:'Spectral',serif;font-weight:500;font-size:46px;line-height:1.06;letter-spacing:-.012em;color:#2b271f;margin:0 0 18px\">The alternatives that exist<\u002Fh2>\n        <p style=\"font-family:'Spectral',serif;font-style:italic;font-size:21px;line-height:1.5;color:#6b6453;margin:0 0 36px;max-width:52ch\">There are other ways to do all of this. None of them are being chosen.<\u002Fp>\n      <\u002Fdiv>\n\n      <div style=\"display:flex;align-items:center;gap:12px;margin:0 0 18px\"><span style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:#7c2d24\">Privacy-preserving verification<\u002Fspan><span style=\"flex:1;height:1px;background:rgba(124,45,36,.22)\"><\u002Fspan><\u002Fdiv>\n      <p style=\"font-family:'Spectral',serif;font-size:18.5px;line-height:1.78;color:#4f493e;margin:0 0 22px;max-width:680px\">There is another way to verify age without building a surveillance infrastructure. Several, in fact.<\u002Fp>\n      <div style=\"overflow-x:auto;margin:0 0 38px\">\n        <table style=\"width:100%;min-width:880px;border-collapse:collapse;font-family:'Spectral',serif\">\n          <thead><tr>\n            <th style=\"text-align:left;font-family:'IBM Plex Mono',monospace;font-size:10px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:#9c7268;padding:0 16px 11px 0;border-bottom:1.5px solid #7c2d24;width:20%\">Method<\u002Fth>\n            <th style=\"text-align:left;font-family:'IBM Plex Mono',monospace;font-size:10px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:#9c7268;padding:0 16px 11px 0;border-bottom:1.5px solid #7c2d24\">How it works<\u002Fth>\n            <th style=\"text-align:left;font-family:'IBM Plex Mono',monospace;font-size:10px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:#9c7268;padding:0 0 11px 0;border-bottom:1.5px solid #7c2d24;width:28%\">Limitation<\u002Fth>\n          <\u002Ftr><\u002Fthead>\n          <tbody>\n            <tr><td style=\"font-size:15px;color:#2b271f;font-weight:500;padding:13px 16px 13px 0;border-bottom:1px solid rgba(124,45,36,.13);vertical-align:top\">Zero-knowledge proofs (ZKP)<\u002Ftd><td style=\"font-size:13.5px;line-height:1.55;color:#4f493e;padding:13px 16px 13px 0;border-bottom:1px solid rgba(124,45,36,.13);vertical-align:top\">Prove a single fact (\u201cI am over 16\u201d) without revealing anything else. Proof generated on your device. Platform gets a cryptographic yes or no. Nothing else transmitted.<\u002Ftd><td style=\"font-size:13.5px;line-height:1.55;color:#5f594b;padding:13px 0;border-bottom:1px solid rgba(124,45,36,.13);vertical-align:top\">Still requires a state-issued document (passport) as trust anchor. The issuer knows who you are \u2014 the anonymity is from the verifier, not from the system.<\u002Ftd><\u002Ftr>\n            <tr><td style=\"font-size:15px;color:#2b271f;font-weight:500;padding:13px 16px 13px 0;border-bottom:1px solid rgba(124,45,36,.13);vertical-align:top\">Decentralised issuance<\u002Ftd><td style=\"font-size:13.5px;line-height:1.55;color:#4f493e;padding:13px 16px 13px 0;border-bottom:1px solid rgba(124,45,36,.13);vertical-align:top\">Multiple issuers (GP, school, bank, notary) \u2014 no single entity holds the full picture. Verifier can\u2019t tell which issuer it came from.<\u002Ftd><td style=\"font-size:13.5px;line-height:1.55;color:#5f594b;padding:13px 0;border-bottom:1px solid rgba(124,45,36,.13);vertical-align:top\">Who decides which issuers are \u201ctrusted\u201d? In practice, the state. Control the trust registry, control the system. Bottleneck moves one layer back, doesn\u2019t disappear.<\u002Ftd><\u002Ftr>\n            <tr><td style=\"font-size:15px;color:#2b271f;font-weight:500;padding:13px 16px 13px 0;border-bottom:1px solid rgba(124,45,36,.13);vertical-align:top\">Self-sovereign identity (SSI)<\u002Ftd><td style=\"font-size:13.5px;line-height:1.55;color:#4f493e;padding:13px 16px 13px 0;border-bottom:1px solid rgba(124,45,36,.13);vertical-align:top\">No institutional issuers. Your identity is attested by a web of peers \u2014 people who know you, who\u2019ll stake reputation that you are who you say you are.<\u002Ftd><td style=\"font-size:13.5px;line-height:1.55;color:#5f594b;padding:13px 0;border-bottom:1px solid rgba(124,45,36,.13);vertical-align:top\">Doesn\u2019t scale to strangers, which is the entire point of identity verification. Works in small communities. Collapses at population scale.<\u002Ftd><\u002Ftr>\n            <tr><td style=\"font-size:15px;color:#2b271f;font-weight:500;padding:13px 16px 13px 0;border-bottom:1px solid rgba(124,45,36,.13);vertical-align:top\">Blind issuance protocols<\u002Ftd><td style=\"font-size:13.5px;line-height:1.55;color:#4f493e;padding:13px 16px 13px 0;border-bottom:1px solid rgba(124,45,36,.13);vertical-align:top\">Issuer verifies your identity but the protocol prevents them from linking the credential to you afterwards. Like a notary signing a sealed envelope.<\u002Ftd><td style=\"font-size:13.5px;line-height:1.55;color:#5f594b;padding:13px 0;border-bottom:1px solid rgba(124,45,36,.13);vertical-align:top\">The issuer has to run the protocol honestly. If the state builds a backdoor \u2014 logs the blinding factor, keeps a side-channel copy \u2014 the blindness is defeated and you\u2019d never know.<\u002Ftd><\u002Ftr>\n            <tr><td style=\"font-size:15px;color:#2b271f;font-weight:500;padding:13px 16px 13px 0;border-bottom:1px solid rgba(124,45,36,.13);vertical-align:top\">Hardware-rooted credentials<\u002Ftd><td style=\"font-size:13.5px;line-height:1.55;color:#4f493e;padding:13px 16px 13px 0;border-bottom:1px solid rgba(124,45,36,.13);vertical-align:top\">Your device holds a credential. When challenged, it produces a proof locally. No network call to the issuer. Issuer literally cannot know when or where you used it.<\u002Ftd><td style=\"font-size:13.5px;line-height:1.55;color:#5f594b;padding:13px 0;border-bottom:1px solid rgba(124,45,36,.13);vertical-align:top\">Who manufactured the hardware? Who wrote the firmware? Intel\u2019s SGX was the gold standard \u2014 then Spectre, Meltdown, Foreshadow. The hardware is a black box and you\u2019re trusting the box-maker.<\u002Ftd><\u002Ftr>\n            <tr><td style=\"font-size:15px;color:#2b271f;font-weight:500;padding:13px 16px 13px 0;border-bottom:1px solid rgba(124,45,36,.13);vertical-align:top\">Blockchain / public ledger<\u002Ftd><td style=\"font-size:13.5px;line-height:1.55;color:#4f493e;padding:13px 16px 13px 0;border-bottom:1px solid rgba(124,45,36,.13);vertical-align:top\">No issuer at all \u2014 the mathematics is the authority. Identity is a key pair. Fully decentralised, fully transparent.<\u002Ftd><td style=\"font-size:13.5px;line-height:1.55;color:#5f594b;padding:13px 0;border-bottom:1px solid rgba(124,45,36,.13);vertical-align:top\">A key pair isn\u2019t an identity. Someone has to bind the key to a human body at some point. That binding is the bottleneck all over again.<\u002Ftd><\u002Ftr>\n          <\u002Ftbody>\n        <\u002Ftable>\n      <\u002Fdiv>\n\n      <div style=\"display:flex;align-items:center;gap:12px;margin:0 0 18px\"><span style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:#7c2d24\">Case study: ZKPassport and the UK consultation<\u002Fspan><span style=\"flex:1;height:1px;background:rgba(124,45,36,.22)\"><\u002Fspan><\u002Fdiv>\n      <div style=\"overflow-x:auto;margin:0 0 30px\">\n        <table style=\"width:100%;min-width:700px;border-collapse:collapse;font-family:'Spectral',serif\">\n          <thead><tr>\n            <th style=\"text-align:left;font-family:'IBM Plex Mono',monospace;font-size:10px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:#9c7268;padding:0 16px 11px 0;border-bottom:1.5px solid #7c2d24;width:22%\">System<\u002Fth>\n            <th style=\"text-align:left;font-family:'IBM Plex Mono',monospace;font-size:10px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:#9c7268;padding:0 16px 11px 0;border-bottom:1.5px solid #7c2d24;width:22%\">Status<\u002Fth>\n            <th style=\"text-align:left;font-family:'IBM Plex Mono',monospace;font-size:10px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:#9c7268;padding:0 0 11px 0;border-bottom:1.5px solid #7c2d24\">Notes<\u002Fth>\n          <\u002Ftr><\u002Fthead>\n          <tbody>\n            <tr><td style=\"font-size:15px;color:#2b271f;font-weight:500;padding:13px 16px 13px 0;border-bottom:1px solid rgba(124,45,36,.13);vertical-align:top\">ZKPassport (Aztec Labs, UK)<\u002Ftd><td style=\"font-size:13.5px;line-height:1.55;color:#4f493e;padding:13px 16px 13px 0;border-bottom:1px solid rgba(124,45,36,.13);vertical-align:top\">Production-ready. Acquired May 2026. Open-source.<\u002Ftd><td style=\"font-size:13.5px;line-height:1.55;color:#5f594b;padding:13px 0;border-bottom:1px solid rgba(124,45,36,.13);vertical-align:top\">Reads NFC chip in existing passports. Proof on device. No data transmitted. No new databases.<\u002Ftd><\u002Ftr>\n            <tr><td style=\"font-size:15px;color:#2b271f;font-weight:500;padding:13px 16px 13px 0;border-bottom:1px solid rgba(124,45,36,.13);vertical-align:top\">EU Digital Identity Wallet (eIDAS 2.0)<\u002Ftd><td style=\"font-size:13.5px;line-height:1.55;color:#4f493e;padding:13px 16px 13px 0;border-bottom:1px solid rgba(124,45,36,.13);vertical-align:top\">Mandated by revised EU regulation. 7 member states piloting. All 27 due by end 2026.<\u002Ftd><td style=\"font-size:13.5px;line-height:1.55;color:#5f594b;padding:13px 0;border-bottom:1px solid rgba(124,45,36,.13);vertical-align:top\">Age verification built using Aztec\u2019s ZK language and ZKPassport\u2019s library. Built on W3C Verifiable Credentials \u2014 the technical standard designed for cross-border wallet interoperability.<\u002Ftd><\u002Ftr>\n            <tr><td style=\"font-size:15px;color:#2b271f;font-weight:500;padding:13px 16px 13px 0;border-bottom:1px solid rgba(124,45,36,.13);vertical-align:top\">WorldCoin / World ID<\u002Ftd><td style=\"font-size:13.5px;line-height:1.55;color:#4f493e;padding:13px 16px 13px 0;border-bottom:1px solid rgba(124,45,36,.13);vertical-align:top\">Live in 20+ countries. 5M+ users.<\u002Ftd><td style=\"font-size:13.5px;line-height:1.55;color:#5f594b;padding:13px 0;border-bottom:1px solid rgba(124,45,36,.13);vertical-align:top\">Iris scan generates unlinkable proofs. But the iris scan happened. \u201cWe deleted the data\u201d is company policy, not a mathematical guarantee.<\u002Ftd><\u002Ftr>\n          <\u002Ftbody>\n        <\u002Ftable>\n      <\u002Fdiv>\n      <p style=\"font-family:'Spectral',serif;font-size:18.5px;line-height:1.78;color:#4f493e;margin:0 0 26px;max-width:680px\">In June 2026, Aztec Labs submitted a formal response to the UK consultation on children\u2019s online safety. They proposed ZKPassport. They asked for three things:<\u002Fp>\n      <div style=\"overflow-x:auto;margin:0 0 30px;max-width:780px\">\n        <table style=\"width:100%;min-width:520px;border-collapse:collapse;font-family:'Spectral',serif\">\n          <thead><tr>\n            <th style=\"text-align:left;font-family:'IBM Plex Mono',monospace;font-size:10px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:#9c7268;padding:0 16px 11px 0;border-bottom:1.5px solid #7c2d24\">What they asked for<\u002Fth>\n            <th style=\"text-align:left;font-family:'IBM Plex Mono',monospace;font-size:10px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:#9c7268;padding:0 0 11px 0;border-bottom:1.5px solid #7c2d24;width:38%\">Government response<\u002Fth>\n          <\u002Ftr><\u002Fthead>\n          <tbody>\n            <tr><td style=\"font-size:15px;color:#2b271f;padding:12px 16px 12px 0;border-bottom:1px solid rgba(124,45,36,.13);vertical-align:top\">Privacy by design as a structural requirement<\u002Ftd><td style=\"font-size:14.5px;line-height:1.5;color:#7c2d24;padding:12px 0;border-bottom:1px solid rgba(124,45,36,.13);vertical-align:top\">Not adopted.<\u002Ftd><\u002Ftr>\n            <tr><td style=\"font-size:15px;color:#2b271f;padding:12px 16px 12px 0;border-bottom:1px solid rgba(124,45,36,.13);vertical-align:top\">ZKP verification recognised within DVS trust framework<\u002Ftd><td style=\"font-size:14.5px;line-height:1.5;color:#7c2d24;padding:12px 0;border-bottom:1px solid rgba(124,45,36,.13);vertical-align:top\">Not mentioned.<\u002Ftd><\u002Ftr>\n            <tr><td style=\"font-size:15px;color:#2b271f;padding:12px 16px 12px 0;border-bottom:1px solid rgba(124,45,36,.13);vertical-align:top\">No restrictions on VPNs<\u002Ftd><td style=\"font-size:14.5px;line-height:1.5;color:#7c2d24;padding:12px 0;border-bottom:1px solid rgba(124,45,36,.13);vertical-align:top\">Not addressed. They didn\u2019t need to \u2014 device-level blocking at the OS means VPNs are irrelevant. The block happens before any traffic leaves the phone.<\u002Ftd><\u002Ftr>\n            <tr><td style=\"font-size:15px;color:#5f594b;padding:12px 16px 12px 0;border-bottom:1px solid rgba(124,45,36,.13);vertical-align:top\">\u2014<\u002Ftd><td style=\"font-size:14.5px;line-height:1.5;color:#5f594b;padding:12px 0;border-bottom:1px solid rgba(124,45,36,.13);vertical-align:top\">15 June 2026 announcement specified facial recognition and digital IDs.<\u002Ftd><\u002Ftr>\n          <\u002Ftbody>\n        <\u002Ftable>\n      <\u002Fdiv>\n      <p style=\"font-family:'Spectral',serif;font-size:18.5px;line-height:1.78;color:#4f493e;margin:0 0 30px;max-width:680px\">October 2025: photographs of government IDs belonging to around 70,000 Discord users were exposed after a breach at a third-party age verification vendor. This is what centralised verification looks like in practice.<\u002Fp>\n      <p class=\"tis-statement\" style=\"font-family:'Spectral',serif;font-weight:500;font-size:22px;line-height:1.55;color:#2b271f;margin:0 0 36px;max-width:680px\">Surveillance infrastructure isn\u2019t a technological inevitability. It\u2019s a policy choice. The technology to verify age without building a database exists. The government knows it exists. The announcement went with facial recognition anyway.<\u002Fp>\n\n      <div style=\"display:flex;align-items:center;gap:12px;margin:0 0 18px\"><span style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:#7c2d24\">The issuer bottleneck<\u002Fspan><span style=\"flex:1;height:1px;background:rgba(124,45,36,.22)\"><\u002Fspan><\u002Fdiv>\n      <div style=\"max-width:680px\">\n        <p style=\"font-family:'Spectral',serif;font-size:18.5px;line-height:1.78;color:#4f493e;margin:0 0 22px\">Every method that actually proves something \u2014 not just self-declaration \u2014 needs a trust anchor somewhere: someone who checked your identity at least once. In the UK, that someone is the state. ZKP reduces the problem \u2014 your passport was already issued, no new data gets created when you use it \u2014 but doesn\u2019t eliminate it.<\u002Fp>\n        <p style=\"font-family:'Spectral',serif;font-size:18.5px;line-height:1.78;color:#4f493e;margin:0 0 38px\">The architecture that would give people genuine privacy is one no government would build, because it would block things governments consider non-negotiable: law enforcement access, tax compliance, sanctions enforcement, court-ordered surveillance.<\u002Fp>\n      <\u002Fdiv>\n\n      <div style=\"display:flex;align-items:center;gap:12px;margin:0 0 18px\"><span style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:#7c2d24\">Protecting children without blanket identification<\u002Fspan><span style=\"flex:1;height:1px;background:rgba(124,45,36,.22)\"><\u002Fspan><\u002Fdiv>\n      <p style=\"font-family:'Spectral',serif;font-size:18.5px;line-height:1.78;color:#4f493e;margin:0 0 22px;max-width:680px\">The social media ban is framed as child protection. But there are ways to protect children that don\u2019t require every adult to digitally identify at device and platform level.<\u002Fp>\n      <div style=\"overflow-x:auto;margin:0 0 30px\">\n        <table style=\"width:100%;min-width:880px;border-collapse:collapse;font-family:'Spectral',serif\">\n          <thead><tr>\n            <th style=\"text-align:left;font-family:'IBM Plex Mono',monospace;font-size:10px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:#9c7268;padding:0 16px 11px 0;border-bottom:1.5px solid #7c2d24;width:18%\">Approach<\u002Fth>\n            <th style=\"text-align:left;font-family:'IBM Plex Mono',monospace;font-size:10px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:#9c7268;padding:0 16px 11px 0;border-bottom:1.5px solid #7c2d24;width:30%\">What it does<\u002Fth>\n            <th style=\"text-align:left;font-family:'IBM Plex Mono',monospace;font-size:10px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:#9c7268;padding:0 0 11px 0;border-bottom:1.5px solid #7c2d24\">Why it\u2019s not being chosen<\u002Fth>\n          <\u002Ftr><\u002Fthead>\n          <tbody>\n            <tr><td style=\"font-size:15px;color:#2b271f;font-weight:500;padding:13px 16px 13px 0;border-bottom:1px solid rgba(124,45,36,.13);vertical-align:top\">Ban addictive algorithms<\u002Ftd><td style=\"font-size:13.5px;line-height:1.55;color:#4f493e;padding:13px 16px 13px 0;border-bottom:1px solid rgba(124,45,36,.13);vertical-align:top\">Prohibit infinite scroll, autoplay, and engagement-maximising recommendation engines for all users under 18. Target the mechanism of harm, not the identity of the user.<\u002Ftd><td style=\"font-size:13.5px;line-height:1.55;color:#5f594b;padding:13px 0;border-bottom:1px solid rgba(124,45,36,.13);vertical-align:top\">Requires regulating platform design, not user identity. Harder to enforce. Less infrastructure built.<\u002Ftd><\u002Ftr>\n            <tr><td style=\"font-size:15px;color:#2b271f;font-weight:500;padding:13px 16px 13px 0;border-bottom:1px solid rgba(124,45,36,.13);vertical-align:top\">End doom-scrolling by design<\u002Ftd><td style=\"font-size:13.5px;line-height:1.55;color:#4f493e;padding:13px 16px 13px 0;border-bottom:1px solid rgba(124,45,36,.13);vertical-align:top\">Mandate session limits, friction-by-design (confirmation prompts after 30 minutes), and chronological feeds for minors.<\u002Ftd><td style=\"font-size:13.5px;line-height:1.55;color:#5f594b;padding:13px 0;border-bottom:1px solid rgba(124,45,36,.13);vertical-align:top\">Platforms resist \u2014 engagement is revenue. But it addresses the actual harm without requiring anyone to scan their passport.<\u002Ftd><\u002Ftr>\n            <tr><td style=\"font-size:15px;color:#2b271f;font-weight:500;padding:13px 16px 13px 0;border-bottom:1px solid rgba(124,45,36,.13);vertical-align:top\">Increase policing of messaging targeting children<\u002Ftd><td style=\"font-size:13.5px;line-height:1.55;color:#4f493e;padding:13px 16px 13px 0;border-bottom:1px solid rgba(124,45,36,.13);vertical-align:top\">Invest in law enforcement units targeting grooming, CSAM distribution, and predatory behaviour in DMs and gaming platforms.<\u002Ftd><td style=\"font-size:13.5px;line-height:1.55;color:#5f594b;padding:13px 0;border-bottom:1px solid rgba(124,45,36,.13);vertical-align:top\">Expensive. Requires human investigators, not automated systems. Doesn\u2019t build infrastructure with secondary uses.<\u002Ftd><\u002Ftr>\n            <tr><td style=\"font-size:15px;color:#2b271f;font-weight:500;padding:13px 16px 13px 0;border-bottom:1px solid rgba(124,45,36,.13);vertical-align:top\">Education programmes<\u002Ftd><td style=\"font-size:13.5px;line-height:1.55;color:#4f493e;padding:13px 16px 13px 0;border-bottom:1px solid rgba(124,45,36,.13);vertical-align:top\">Digital literacy in schools. Age-appropriate online safety curricula. Parental tools and guidance.<\u002Ftd><td style=\"font-size:13.5px;line-height:1.55;color:#5f594b;padding:13px 0;border-bottom:1px solid rgba(124,45,36,.13);vertical-align:top\">Slow. Undramatic. Doesn\u2019t generate a three-month deadline, a tech-week announcement, or a 70% poll number.<\u002Ftd><\u002Ftr>\n          <\u002Ftbody>\n        <\u002Ftable>\n      <\u002Fdiv>\n      <p style=\"font-family:'Spectral',serif;font-size:18.5px;line-height:1.78;color:#4f493e;margin:0 0 38px;max-width:680px\">None of these approaches require building a national identity verification layer. All of them address the stated problem \u2014 harm to children \u2014 directly. The government chose the approach that requires the most infrastructure and the least algorithmic regulation.<\u002Fp>\n\n      <div style=\"display:flex;align-items:center;gap:12px;margin:0 0 18px\"><span style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:#7c2d24\">Individual workarounds \u2014 and why they fail<\u002Fspan><span style=\"flex:1;height:1px;background:rgba(124,45,36,.22)\"><\u002Fspan><\u002Fdiv>\n      <p style=\"font-family:'Spectral',serif;font-size:18.5px;line-height:1.78;color:#4f493e;margin:0 0 22px;max-width:680px\">For the tech-literate, there are ways to opt out. For now. Each comes with a shelf life.<\u002Fp>\n      <p style=\"font-family:'Spectral',serif;font-size:18.5px;line-height:1.78;color:#4f493e;margin:0 0 22px;max-width:680px\"><strong style=\"color:#2b271f\">GrapheneOS<\u002Fstrong> \u2014 a privacy-focused open-source Android fork. No Google services. No Play Store telemetry. Currently the best option for avoiding device-level attestation. But GrapheneOS developers have acknowledged the problem: Google\u2019s increasingly aggressive device attestation requirements (SafetyNet, Play Integrity API) are designed to verify that the OS is an approved, unmodified build. Apps that rely on these checks \u2014 banking, government services, increasingly social media \u2014 won\u2019t run on unattested devices. GrapheneOS has started working on compatibility layers, but they know the long-term trajectory. As more apps require attestation, the usable app ecosystem on non-approved operating systems shrinks to nothing.<\u002Fp>\n      <p style=\"font-family:'Spectral',serif;font-size:18.5px;line-height:1.78;color:#4f493e;margin:0 0 22px;max-width:680px\"><strong style=\"color:#2b271f\">Linux phones<\u002Fstrong> \u2014 PinePhone, Librem 5, postmarketOS. Full control over your operating system. But which apps will you use? Most apps will include attestation code and checks. If the underlying OS doesn\u2019t pass, the apps don\u2019t work. No banking. No government services. No rideshare. No food delivery. The phone works \u2014 it just can\u2019t participate in modern life.<\u002Fp>\n      <p style=\"font-family:'Spectral',serif;font-size:18.5px;line-height:1.78;color:#4f493e;margin:0 0 22px;max-width:680px\"><strong style=\"color:#2b271f\">eSIM lockout<\u002Fstrong> \u2014 physical SIMs are being phased out. eSIM activation increasingly requires device attestation. If your phone can\u2019t prove it\u2019s running an approved OS, you can\u2019t activate a mobile connection. Buy a phone from another jurisdiction with the OS pre-configured \u2014 but what happens on the next OS update?<\u002Fp>\n      <p style=\"font-family:'Spectral',serif;font-size:18.5px;line-height:1.78;color:#4f493e;margin:0 0 22px;max-width:680px\"><strong style=\"color:#2b271f\">Open-source desktop Linux<\u002Fstrong> \u2014 Ubuntu, Debian, Mint. Currently untouched by device-level identity requirements. But if web-based services start requiring browser-level attestation (Google\u2019s Web Environment Integrity proposal, shelved in 2023, will resurface), the same pattern applies. They\u2019ll add it to the mainstream distributions. Removing it will mean compiling a custom kernel.<\u002Fp>\n      <p style=\"font-family:'Spectral',serif;font-size:18.5px;line-height:1.78;color:#4f493e;margin:0 0 22px;max-width:680px\"><strong style=\"color:#2b271f\">The lone wolf position<\u002Fstrong> \u2014 you can\u2019t hide or spoof the hardware UUID from the manufacturer at the device level. Hardware manufacturers and OS vendors control root access to the identifier. The only clean option: download everything locally, wipe your device, and go offline. The only way to win is not to play.<\u002Fp>\n      <p class=\"tis-statement\" style=\"font-family:'Spectral',serif;font-weight:500;font-size:22px;line-height:1.55;color:#2b271f;margin:0 0 36px;max-width:680px\">This is the holdout arithmetic. Every workaround is technically possible today. Each becomes harder as the infrastructure tightens. The system doesn\u2019t need to ban alternatives \u2014 it just needs to make non-participation expensive enough that almost nobody does it. The phone still works. It just can\u2019t access your bank, your government services, your children\u2019s school portal, or the platforms where everyone else is.<\u002Fp>\n\n      <div style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;line-height:1.7;color:#a59b89;border-top:1px solid rgba(90,78,55,.22);padding-top:14px\">Sources&nbsp;&nbsp;Aztec Labs consultation response, June 2026 \u00b7 EU Digital Identity Wallet programme \u00b7 Discord / ID breach reporting, Oct 2025 \u00b7 GrapheneOS attestation documentation \u00b7 Google Play Integrity API docs<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <div aria-hidden=\"true\" style=\"position:relative;z-index:2;height:58px;margin:0 auto;max-width:1080px;background:url(&quot;a23bab68.webp&quot;) center/cover;opacity:.5;-webkit-mask-image:linear-gradient(90deg,transparent,#000 24%,#000 76%,transparent);mask-image:linear-gradient(90deg,transparent,#000 24%,#000 76%,transparent)\"><\u002Fdiv>\n\n  <!-- ============ LAYER 11 ============ -->\n  <section id=\"L11\" data-layer=\"10\" data-screen-label=\"11 Programmable money\" style=\"position:relative;z-index:2;padding:120px 0\">\n    \n  <div class=\"tis-wrap\" style=\"max-width:768px;margin:0 auto;padding:0 64px\">\n      <div>\n        <div style=\"font-family:'IBM Plex Mono',monospace;font-size:13px;letter-spacing:.16em;color:#7c2d24\">11<span style=\"color:#a59b89\"> / 12<\u002Fspan><\u002Fdiv>\n        <div style=\"width:42px;height:2px;background:#7c2d24;margin:14px 0 16px\"><\u002Fdiv>\n        <h2 class=\"tis-h-title\" style=\"font-family:'Spectral',serif;font-weight:500;font-size:46px;line-height:1.06;letter-spacing:-.012em;color:#2b271f;margin:0 0 18px\">Programmable money<\u002Fh2>\n        <p style=\"font-family:'Spectral',serif;font-style:italic;font-size:21px;line-height:1.5;color:#6b6453;margin:0 0 36px;max-width:52ch\">When the wallet that holds your licence now holds your money \u2014 with rules you didn't set.<\u002Fp>\n      <\u002Fdiv>\n      <p style=\"font-family:'Spectral',serif;font-size:18.5px;line-height:1.78;color:#4f493e;margin:0 0 22px\">A Central Bank Digital Currency \u2014 the \"digital pound\" \u2014 is the last piece. The Bank of England is consulting on it. No commitment to launch has been made.<\u002Fp>\n      <p style=\"font-family:'Spectral',serif;font-size:18.5px;line-height:1.78;color:#4f493e;margin:0 0 22px\">A CBDC linked to the GOV.UK Wallet would close the loop: your identity, your health records, your biometric profile, and your financial transactions \u2014 all inside the same infrastructure, searchable by the same engine.<\u002Fp>\n      <p style=\"font-family:'Spectral',serif;font-size:18.5px;line-height:1.78;color:#4f493e;margin:0 0 30px\">Programmable money can carry conditions. Expiry dates. Spending categories. Location restrictions. Conditional access. The wallet that holds your driving licence and your NHS number now holds your money. The money has rules you didn't set and can't change.<\u002Fp>\n      <div style=\"margin:0 0 32px\">\n        <table style=\"width:100%;border-collapse:collapse;font-family:'Spectral',serif\">\n          <thead><tr>\n            <th style=\"text-align:left;font-family:'IBM Plex Mono',monospace;font-size:10px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:#9c7268;padding:0 16px 11px 0;border-bottom:1.5px solid #7c2d24;width:34%\">Layer<\u002Fth>\n            <th style=\"text-align:left;font-family:'IBM Plex Mono',monospace;font-size:10px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:#9c7268;padding:0 0 11px 0;border-bottom:1.5px solid #7c2d24\">Component<\u002Fth>\n          <\u002Ftr><\u002Fthead>\n          <tbody>\n            <tr><td style=\"font-size:16px;color:#2b271f;font-weight:500;padding:12px 16px 12px 0;border-bottom:1px solid rgba(124,45,36,.13)\">Identity<\u002Ftd><td style=\"font-size:16px;color:#4f493e;padding:12px 0;border-bottom:1px solid rgba(124,45,36,.13)\">GOV.UK Wallet<\u002Ftd><\u002Ftr>\n            <tr><td style=\"font-size:16px;color:#2b271f;font-weight:500;padding:12px 16px 12px 0;border-bottom:1px solid rgba(124,45,36,.13)\">Data integration<\u002Ftd><td style=\"font-size:16px;color:#4f493e;padding:12px 0;border-bottom:1px solid rgba(124,45,36,.13)\">Palantir Foundry<\u002Ftd><\u002Ftr>\n            <tr><td style=\"font-size:16px;color:#2b271f;font-weight:500;padding:12px 16px 12px 0;border-bottom:1px solid rgba(124,45,36,.13)\">Biometrics<\u002Ftd><td style=\"font-size:16px;color:#4f493e;padding:12px 0;border-bottom:1px solid rgba(124,45,36,.13)\">NEC + device + behavioural<\u002Ftd><\u002Ftr>\n            <tr><td style=\"font-size:16px;color:#2b271f;font-weight:500;padding:12px 16px 12px 0;border-bottom:1px solid rgba(124,45,36,.13)\">Transactions<\u002Ftd><td style=\"font-size:16px;color:#7c2d24;font-weight:500;padding:12px 0;border-bottom:1px solid rgba(124,45,36,.13)\">Digital pound (pending)<\u002Ftd><\u002Ftr>\n          <\u002Ftbody>\n        <\u002Ftable>\n      <\u002Fdiv>\n      <p class=\"tis-statement\" style=\"font-family:'Spectral',serif;font-weight:500;font-size:24px;line-height:1.5;letter-spacing:-.006em;color:#2b271f;margin:0 0 14px;max-width:50ch\">Without the CBDC, the components sit next to each other. With it, they become one system.<\u002Fp>\n      \n      <p style=\"font-family: 'Spectral',serif; font-style: italic; font-size: 30px; line-height: 1.6; color: #7c2d24; margin: 0 0 40px; font-weight: 800\">This is the rail that hasn\u2019t been laid. Every other rail is in place.<\u002Fp><p class=\"tis-statement\" style=\"font-family:'Spectral',serif;font-weight:500;font-size:24px;line-height:1.5;letter-spacing:-.006em;color:#2b271f;margin:0 0 36px;max-width:52ch\">The system doesn't need to be malicious at launch.<br>It just needs to be capable.<br>The architecture is one configuration change from total oversight \u2014 and one breach from total exposure.<\u002Fp>\n      <div style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;line-height:1.7;color:#a59b89;border-top:1px solid rgba(90,78,55,.22);padding-top:14px\"><div style=\"display:flex;align-items:center;gap:12px;margin:0 0 18px\"><span style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:#7c2d24\">A reasonable objection<\u002Fspan><span style=\"flex:1;height:1px;background:rgba(124,45,36,.22)\"><\u002Fspan><\u002Fdiv>\n      <p style=\"font-family:'Spectral',serif;font-size:18.5px;line-height:1.78;color:#4f493e;margin:0 0 22px;max-width:680px\">Device-level verification is not the same as a permanently connected interoperable identity layer linked to programmable currency. That\u2019s true. The state requesting your identity from Apple via a warrant is meaningfully different from the state having continuous automated access to your identity, transactions, and location.<\u002Fp>\n      <p style=\"font-family:'Spectral',serif;font-size:18.5px;line-height:1.78;color:#4f493e;margin:0 0 36px;max-width:680px\">This document does not claim they are the same. It maps every step between one and the other \u2014 and shows that each step has already been built, legislated, or funded. The distance between \u201ctargeted request\u201d and \u201cpermanent access\u201d is not a wall. It is a corridor. And every door in it is already open.<\u002Fp>\n      <div style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;line-height:1.7;color:#a59b89;border-top:1px solid rgba(90,78,55,.22);padding-top:14px\">Sources&nbsp;&nbsp;Bank of England consultation \u00b7 BIS CBDC research<\u002Fdiv>\n    <\u002Fdiv><\u002Fsection>\n\n  <!-- ============ LAYER 11 \u2014 THE QUESTION ============ -->\n  <section id=\"L12\" data-layer=\"11\" data-screen-label=\"12 The concern\" style=\"position:relative;z-index:2;min-height:100vh;overflow:hidden;display:flex;align-items:center;background:linear-gradient(102deg,#2c2014,#34271a 48%,#241a10)\">\n    <svg width=\"100%\" height=\"100%\" preserveAspectRatio=\"none\" style=\"position:absolute;inset:0;opacity:.6\"><rect width=\"100%\" height=\"100%\" filter=\"url(#tisWood)\"><\u002Frect><\u002Fsvg>\n    <div style=\"position:absolute;inset:0;background:#241a10 url(&quot;236c8c06.webp&quot;) center/cover no-repeat\"><\u002Fdiv>\n    <div style=\"position:absolute;inset:0;pointer-events:none;background:rgba(18,12,6,.42)\"><\u002Fdiv>\n    <div style=\"position:absolute;inset:0;pointer-events:none;background:radial-gradient(120% 90% at 50% 45%,transparent 36%,rgba(15,10,5,.62))\"><\u002Fdiv>\n    <div class=\"tis-wrap\" style=\"position:relative;width:100%;max-width:800px;margin:0 auto;padding:120px 64px;text-align:center;pointer-events:none\">\n      <div style=\"font-family:'IBM Plex Mono',monospace;font-size:13px;letter-spacing:.16em;color:#b0463b\">12<span style=\"color:#9a8a6a\"> / 12<\u002Fspan><\u002Fdiv>\n      <div style=\"width:42px;height:2px;background:#b0463b;margin:14px 0 16px\"><\u002Fdiv>\n      <h2 class=\"tis-h-title\" style=\"font-family:'Spectral',serif;font-weight:500;font-size:46px;line-height:1.06;letter-spacing:-.012em;color:#f1e9da;margin:0 0 36px\">The concern<\u002Fh2>\n      <p style=\"font-family:'EB Garamond',serif;font-size:21px;line-height:1.7;color:#c4b89e;margin:0 0 24px\">Few would object to children being protected, borders being controlled, or fraud prevented. In isolation, every piece of this architecture is defensible.<\u002Fp>\n      <p style=\"font-family:'EB Garamond',serif;font-size:21px;line-height:1.7;color:#f1e9da;margin:0 0 24px\">But no one was asked whether these systems should be connected. It was in no manifesto or on any consultation form.<\u002Fp>\n      <p style=\"font-family:'EB Garamond',serif;font-style:italic;font-size:28px;line-height:1.42;color:#f1e9da;margin:0 0 42px;text-wrap:balance\">Every piece in isolation is defensible.<br>Together they form <span style=\"font-style:normal;font-weight:500\">The Interoperable State.<\u002Fspan><\u002Fp>\n      <div style=\"display:flex;align-items:center;gap:12px;margin:36px 0 18px\"><span style=\"font-family:\u2019IBM Plex Mono\u2019,monospace;font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:#b0463b\">Not only here<\u002Fspan><span style=\"flex:1;height:1px;background:rgba(176,70,59,.3)\"><\u002Fspan><\u002Fdiv>\n      <p style=\"font-family:\u2019EB Garamond\u2019,serif;font-size:21px;line-height:1.7;color:#c4b89e;margin:0 0 24px\">This document maps the UK. The same architecture is being built simultaneously in every major jurisdiction.<\u002Fp>\n      <p style=\"font-family:\u2019EB Garamond\u2019,serif;font-size:21px;line-height:1.7;color:#f1e9da;margin:0 0 24px\">The EU\u2019s eIDAS 2.0 regulation mandates digital identity wallets across all 27 member states by end 2026 \u2014 built on W3C Verifiable Credentials, the technical standard designed for cross-border interoperability. India\u2019s Aadhaar system has enrolled 1.3 billion people in biometric digital identity linked to banking, taxation, and welfare. The United Nations\u2019 Sustainable Development Goal 16.9 mandates \u201clegal identity for all, including birth registration\u201d by 2030 \u2014 the international policy driver connecting every national programme.<\u002Fp>\n      <p style=\"font-family:\u2019EB Garamond\u2019,serif;font-size:21px;line-height:1.7;color:#c4b89e;margin:0 0 24px\">Different countries. Different legal traditions. Different political justifications \u2014 child protection here, financial inclusion there, counter-terrorism elsewhere. Same architecture. Same trajectory. Because the standards underneath \u2014 W3C Verifiable Credentials, ISO\u002FIEC biometric data interchange formats, ICAO passport specifications \u2014 are designed for interoperability by default. The specification doesn\u2019t care which government is building. It cares that the format is machine-readable, cryptographically verifiable, and interoperable. The word is in this document\u2019s title. It\u2019s also in the specification.<\u002Fp>\n      <p style=\"font-family:\u2019EB Garamond\u2019,serif;font-style:italic;font-size:28px;line-height:1.42;color:#f1e9da;margin:0 0 42px;text-wrap:balance\">The UK is not an outlier. It is a case study.<\u002Fp>\n      <p style=\"font-family:'EB Garamond',serif;font-size:21px;line-height:1.7;color:#c4b89e;margin:0 0 24px\">This architecture guarantees that a data breach anywhere becomes a data breach everywhere.<\u002Fp>\n      <p style=\"font-family:'EB Garamond',serif;font-size:21px;line-height:1.7;color:#f1e9da;margin:0 0 24px\">But a far greater concern is not that information may fall into the wrong hands. It\u2019s that it will fall into the right ones \u2014 the ones that built the system \u2014 with capabilities that don\u2019t require misuse or a breach to be dangerous.<\u002Fp>\n      <p style=\"font-family:'EB Garamond',serif;font-size:21px;line-height:1.7;color:#f1e9da;margin:0 0 24px\">A breach is a crime. The system working as designed is a capability. The capability to make participation in society conditional \u2014 not by a hacker, but by policy.<\u002Fp>\n      <p style=\"font-family:'EB Garamond',serif;font-size:21px;line-height:1.7;color:#c4b89e;margin:0 0 24px\">Whether those conditions are ever imposed, and what they might be, are political questions. Whether they <em>can<\u002Fem> be imposed is simply an engineering question.<\u002Fp>\n      <p style=\"font-family:'EB Garamond',serif;font-size:21px;line-height:1.7;color:#f1e9da;margin:0 0 24px\">One Login and age verification are not the system. They are the consent layer for a system that already identifies you through the products you already use. Refusing the consent form while continuing to broadcast the data it authorises changes nothing except the legal tidiness of your file.<\u002Fp>\n      <p style=\"font-family:'EB Garamond',serif;font-size:21px;line-height:1.7;color:#c4b89e;margin:0 0 24px\">Privacy-preserving alternatives exist, are proven to work, and have been formally proposed.<\u002Fp>\n      <p style=\"font-family:'EB Garamond',serif;font-size:21px;line-height:1.7;color:#c4b89e;margin:0 0 36px\">They have not been chosen.<\u002Fp>\n      <p style=\"font-family:'EB Garamond',serif;font-size:21px;line-height:1.7;color:#f1e9da;margin:0 0 24px\">So the question is whether you\u2019re comfortable with this capability existing \u2014 in any hands, right or wrong \u2014 with no off switch you control.<\u002Fp>\n      <p style=\"font-family:'EB Garamond',serif;font-size:21px;line-height:1.7;color:#b0463b;margin:0 0 36px\"><strong>The clock is ticking\u2026<\u002Fstrong><\u002Fp>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n<\u002Fmain>\n\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nclass Component extends DCLogic {\n  componentDidMount() {\n    const layers = [\n      ['01','Social media ban'],['02','Digital identity'],['03','One Login'],\n      ['04','Data interoperability'],['05','Biometrics'],['06','The installed base'],\n      ['07','Vulnerability'],['08','The black box'],['09','The alternative'],\n      ['10','Programmable money'],['11','The concern']\n    ];\n    const gauge = document.getElementById('tis-gauge');\n    const progress = document.getElementById('tis-progress');\n    if (!gauge) return;\n\n    const rows = layers.map(([n, t], i) => {\n      const row = document.createElement('button');\n      row.type = 'button';\n      row.setAttribute('aria-label', n + ' ' + t);\n      row.style.cssText = 'display:flex;align-items:center;gap:11px;background:none;border:0;padding:0;cursor:pointer;text-align:left;font-family:\"IBM Plex Mono\",monospace';\n      const num = document.createElement('span');\n      num.textContent = n;\n      num.style.cssText = 'font-size:10px;letter-spacing:.04em;color:#b3a892;width:16px;transition:color .35s';\n      const bar = document.createElement('span');\n      bar.style.cssText = 'display:block;height:7px;width:14px;border-radius:1.5px;background:#cabd9f;opacity:.5;transition:all .45s cubic-bezier(.2,.7,.2,1)';\n      const label = document.createElement('span');\n      label.textContent = t;\n      label.style.cssText = 'font-size:11px;letter-spacing:.02em;color:#2b271f;white-space:nowrap;opacity:0;transform:translateX(-4px);transition:opacity .25s,transform .25s;font-weight:500;background:rgba(241,236,225,.97);padding:3px 9px;border-radius:4px;box-shadow:0 6px 20px -8px rgba(40,28,14,.5);pointer-events:none';\n      row.appendChild(num); row.appendChild(bar); row.appendChild(label);\n      row.addEventListener('click', () => {\n        const target = document.getElementById('L' + (i + 1));\n        if (target) window.scrollTo({ top: target.offsetTop, behavior: 'smooth' });\n      });\n      row.addEventListener('mouseenter', () => { label.style.opacity = '1'; label.style.transform = 'translateX(0)'; });\n      row.addEventListener('mouseleave', () => { label.style.opacity = '0'; label.style.transform = 'translateX(-4px)'; });\n      gauge.appendChild(row);\n      return { row, num, bar, label };\n    });\n\n    const sections = () => Array.from(document.querySelectorAll('[data-layer]'));\n    const reveal = Array.from(document.querySelectorAll('[data-reveal]'));\n    reveal.forEach((el) => { el.style.opacity = '0'; el.style.transform = 'translateY(18px)'; el.style.transition = 'opacity .9s cubic-bezier(.2,.7,.2,1),transform .9s cubic-bezier(.2,.7,.2,1)'; });\n    let raf = 0;\n    const update = () => {\n      raf = 0;\n      const secs = sections();\n      const mid = window.scrollY + window.innerHeight * 0.42;\n      let active = -1;\n      secs.forEach((s) => { if (s.offsetTop <= mid) active = parseInt(s.dataset.layer, 10); });\n      const midY = window.scrollY + window.innerHeight / 2;\n      const cover = document.querySelector('[data-screen-label=\"Cover\"]');\n      const qEl = document.getElementById('L11');\n      const inEl = (el) => el && midY >= el.offsetTop && midY < el.offsetTop + el.offsetHeight;\n      const dark = inEl(cover) || inEl(qEl);\n      const P = dark\n        ? { dep: '#b6a98c', depN: '#c9bca0', act: '#c5503e', actN: '#d9795f', up: '#6f6450', upN: '#94876c', lbl: '#ece3d2' }\n        : { dep: '#5f594b', depN: '#8a8170', act: '#7c2d24', actN: '#7c2d24', up: '#cabd9f', upN: '#bdb19b', lbl: '#2b271f' };\n      const cap = gauge.firstElementChild;\n      if (cap) cap.style.color = dark ? '#b0a487' : '#a89c84';\n      rows.forEach((r, i) => {\n        if (i < active) {\n          r.bar.style.width = '40px'; r.bar.style.opacity = '1'; r.bar.style.background = P.dep; r.num.style.color = P.depN;\n        } else if (i === active) {\n          r.bar.style.width = '58px'; r.bar.style.opacity = '1'; r.bar.style.background = P.act; r.num.style.color = P.actN;\n        } else {\n          r.bar.style.width = '14px'; r.bar.style.opacity = '.5'; r.bar.style.background = P.up; r.num.style.color = P.upN;\n        }\n      });\n      const vh = window.innerHeight;\n      reveal.forEach((el) => {\n        if (el.dataset.shown) return;\n        if (el.getBoundingClientRect().top < vh * 0.9) { el.style.opacity = '1'; el.style.transform = 'none'; el.dataset.shown = '1'; }\n      });\n      const max = document.body.scrollHeight - window.innerHeight;\n      progress.style.width = (max > 0 ? (window.scrollY / max) * 100 : 0) + '%';\n    };\n    const onScroll = () => { if (!raf) raf = requestAnimationFrame(update); };\n    window.addEventListener('scroll', onScroll, { passive: true });\n    window.addEventListener('resize', onScroll, { passive: true });\n    setTimeout(update, 60);\n    setTimeout(update, 420);\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"</script>
