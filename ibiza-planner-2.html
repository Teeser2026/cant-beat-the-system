.landing-dates{font-family:'Josefin Sans';font-size:16px;font-weight:300;opacity:.85;letter-spacing:.1em;margin-bottom:28px;text-transform:uppercase}
.landing-divider{width:50px;height:1px;background:rgba(255,255,255,.25);margin:0 auto 28px}
.landing-names{font-family:'Plus Jakarta Sans';font-size:13px;font-weight:400;letter-spacing:.06em;opacity:.6;margin-bottom:32px;line-height:1.6}

.landing-hotel{background:rgba(255,255,255,.1);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.15);border-radius:10px;padding:12px 18px;text-align:center;min-width:160px}
.landing-hotel-name{font-family:'Josefin Sans';font-size:13px;font-weight:400;margin-bottom:3px;text-transform:uppercase;letter-spacing:.06em}
.landing-hotel-dates{font-family:'Plus Jakarta Sans';font-size:11px;opacity:.6}
.landing-flights{font-size:10.5px;opacity:.45;margin-top:20px;margin-bottom:32px;line-height:1.8}
.landing-enter{background:#fff;color:var(--navy);border:none;border-radius:12px;padding:14px 40px;font-family:'Josefin Sans';font-size:14px;font-weight:400;cursor:pointer;letter-spacing:.08em;text-transform:uppercase;transition:all .2s;box-shadow:0 4px 20px rgba(0,0,0,.2)}
.landing-enter:hover{transform:translateY(-2px);box-shadow:0 6px 30px rgba(0,0,0,.3)}
.landing-photo-btn{position:absolute;bottom:20px;right:20px;z-index:3;background:rgba(255,255,255,.15);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.2);color:#fff;border-radius:8px;padding:8px 14px;font-size:11px;font-weight:600;cursor:pointer;font-family:inherit;display:flex;align-items:center;gap:6px;transition:all .15s}
.landing-photo-btn:hover{background:rgba(255,255,255,.25)}
.landing-photo-btn input{display:none}
.back-btn{position:fixed;top:12px;left:12px;z-index:50;background:rgba(26,39,68,.8);color:#fff;border:none;border-radius:8px;padding:6px 14px;font-family:'Plus Jakarta Sans';font-size:11.5px;font-weight:500;cursor:pointer;backdrop-filter:blur(10px)}
.back-btn:hover{background:var(--navy)}
.wrap{max-width:940px;margin:0 auto;padding:0 12px 40px}
.hdr{background:linear-gradient(135deg,var(--navy),var(--navy-light));border-radius:0 0 14px 14px;padding:16px 18px 12px;color:#fff;margin-bottom:14px}
.hdr-top{display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:6px}
.hdr-left small{font-family:'Josefin Sans';font-size:10px;text-transform:uppercase;letter-spacing:.14em;opacity:.65;font-weight:400}
.hdr-left h1{font-family:'Josefin Sans';font-size:20px;font-weight:400;letter-spacing:.06em;margin-top:3px;text-transform:uppercase}
.hdr-right{font-size:10.5px;opacity:.75;text-align:right;line-height:1.5}
.hdr-hotels{display:flex;gap:10px;margin-top:6px;font-size:10px;font-weight:600}

.sync-ok{background:#4a9e6b}
.sync-saving{background:#c9a94e}
.sync-err{background:#e63946}
.tabs{display:flex;gap:3px;margin-top:12px;overflow-x:auto;scrollbar-width:none;padding-bottom:1px}
.tabs::-webkit-scrollbar{display:none}

.tab.active{background:rgba(255,255,255,.93);color:var(--navy);font-weight:700}
.tab:not(.active){background:rgba(255,255,255,.08);color:rgba(255,255,255,.7);font-weight:500}
.tab .dot{display:inline-block;width:4.5px;height:4.5px;border-radius:50%;margin-left:5px;vertical-align:middle}
.daybar{display:flex;justify-content:space-between;align-items:center;padding:0 3px;margin-bottom:12px;flex-wrap:wrap;gap:5px}
.daybar-label{font-family:'Josefin Sans';font-weight:400;font-size:16px;text-transform:uppercase;letter-spacing:.06em}
.daybar-title{font-family:'Josefin Sans';color:#888;font-size:13px;margin-left:8px;cursor:pointer;border-bottom:1px dashed #ccc;padding-bottom:1px;text-transform:uppercase;letter-spacing:.04em}

.daybar-title-input{font-family:'Josefin Sans';font-size:13px;margin-left:8px;border:1.5px solid var(--sea);border-radius:5px;padding:2px 8px;outline:none;color:var(--navy);width:160px;text-transform:uppercase;letter-spacing:.04em}

.slot-label{font-family:'Josefin Sans';font-weight:400;font-size:13px;color:var(--navy);text-transform:uppercase;letter-spacing:.06em}
.slot-time{font-size:10.5px;color:#999}

.slot-comment textarea::placeholder{color:#ccc}

.mbtn-ok{border:none;background:var(--navy);color:#fff}
.mbtn-ok:disabled{background:#ccc;cursor:default}

.photo-thumb{position:relative;width:90px;height:90px;border-radius:8px;overflow:hidden;flex-shrink:0}

@media(max-width:680px){.main{flex-direction:column}.pool-wrap{flex:1 1 100%;min-width:0}}
</style>

// ─── STATE ──────────────────────────────────────────────────
let state=null;
let syncStatus="saving";
let saveTimer=null;
let showPlanner=false;

async function loadState(){
  try{
    const{data,error}=await sb.from("planner_state").select("state").eq("id",ROW_ID).single();
    if(error&&error.code==="PGRST116"){
      // No row yet — create with defaults
      state=makeDefault();
      await sb.from("planner_state").insert({id:ROW_ID,state:state,updated_at:new Date().toISOString()});
      syncStatus="ok";
    }else if(error){
      throw error;
    }else{
      state=data.state;
      // Ensure selDay and filter exist (older saves)
      if(state.selDay===undefined)state.selDay=0;
      if(!state.filter)state.filter="all";
      // Ensure all slots exist on all days (handles new slots added later)
      DAYS.forEach(d=>{if(!state.placed[d.d])state.placed[d.d]={};if(!state.comments[d.d])state.comments[d.d]={};SLOTS.forEach(sl=>{if(!state.placed[d.d][sl.id])state.placed[d.d][sl.id]=[];if(!state.comments[d.d][sl.id])state.comments[d.d][sl.id]=""})});
      // Ensure dayTitles exists
      if(!state.dayTitles)state.dayTitles={};
      DAYS.forEach(d=>{if(!state.dayTitles[d.d])state.dayTitles[d.d]=d.t});
      // Ensure photos exists
      if(!state.photos)state.photos={};
      DAYS.forEach(d=>{if(!state.photos[d.d])state.photos[d.d]=[]});
      if(state.coverPhoto===undefined)state.coverPhoto=null;
      syncStatus="ok";
    }
  }catch(e){
    console.error("Load error:",e);
    state=makeDefault();
    syncStatus="err";
  }
  render();
}

async function saveState(){
  syncStatus="saving";
  updateSyncDot();
  try{
    const{error}=await sb.from("planner_state").update({state:state,updated_at:new Date().toISOString()}).eq("id",ROW_ID);
    if(error)throw error;
    syncStatus="ok";
  }catch(e){
    console.error("Save error:",e);
    syncStatus="err";
  }
  updateSyncDot();
}

function debounceSave(){
  clearTimeout(saveTimer);
  syncStatus="saving";
  updateSyncDot();
  saveTimer=setTimeout(()=>saveState(),400);
}

function updateSyncDot(){
  const el=document.getElementById("sync-dot");
  if(!el)return;
  el.className="sync-dot sync-"+syncStatus;
  el.title=syncStatus==="ok"?"Synced":syncStatus==="saving"?"Saving…":"Sync error";
}

// ─── REALTIME ───────────────────────────────────────────────
let ignoreNext=false;
sb.channel("planner")
  .on("postgres_changes",{event:"UPDATE",schema:"public",table:"planner_state",filter:`id=eq.${ROW_ID}`},(payload)=>{
    if(ignoreNext){ignoreNext=false;return}
    const remote=payload.new.state;
    if(!remote)return;
    // Preserve local UI state (selDay, filter) but take remote data
    const localSel=state?state.selDay:0;
    const localFil=state?state.filter:"all";
    state=remote;
    state.selDay=localSel;
    state.filter=localFil;
    syncStatus="ok";
    render();
  })
  .subscribe();

async function uploadCover(event){
  const file=event.target.files[0];
  if(!file)return;
  const ext=file.name.split(".").pop()||"jpg";
  const path=`cover/${Date.now()}.${ext}`;
  try{
    // Remove old cover if exists
    if(state.coverPhoto&&state.coverPhotoPath){
      try{await sb.storage.from(BUCKET).remove([state.coverPhotoPath])}catch(e){}
    }
    const{error}=await sb.storage.from(BUCKET).upload(path,file,{cacheControl:"3600",upsert:false});
    if(error)throw error;
    const{data:urlData}=sb.storage.from(BUCKET).getPublicUrl(path);
    state.coverPhoto=urlData.publicUrl;
    state.coverPhotoPath=path;
    ignoreNext=true;await saveState();render();
  }catch(e){
    console.error("Cover upload error:",e);
    alert("Upload failed: "+e.message);
  }
}

function cardHTML(a,compact,rmAction,showDel){
  const c=CATS[a.cat]||CATS.restaurant;
  const pr=rmAction?40:(showDel?40:20);
  let h=`<div class="card${compact?" compact":""}" draggable="true"
    ondragstart="dragStart(event,'${a.id}')" ondragend="dragEnd()"
    style="background:${c.bg};border:1.5px solid ${c.bd}">`;
  h+=`<button class="card-edit" onclick="event.stopPropagation();editActivity('${a.id}')" title="Edit">✎</button>`;
  if(rmAction)h+=`<button class="card-rm" onclick="${rmAction}" title="Remove">×</button>`;
  if(showDel)h+=`<button class="card-del" onclick="delActivity('${a.id}')" title="Delete activity">×</button>`;
  h+=`<div class="card-top" style="padding-right:${pr}px">
    <div style="flex:1;min-width:0">
      <div class="card-title" style="color:${c.tx}">${a.title}</div>
      <div class="card-sub" style="color:${c.tg}">${a.sub}</div>
    </div>
    <span class="card-tag" style="background:${c.tg}">${a.cat}</span>
  </div>`;
  if(!compact&&a.desc)h+=`<div class="card-desc">${a.desc}</div>`;
  if(!compact&&a.notes)h+=`<div class="card-notes">${a.notes}</div>`;
  if(a.who)h+=`<span class="card-who">${a.who}</span>`;
  h+=`</div>`;
  return h;
}

// ─── ACTIONS ────────────────────────────────────────────────
function selDay(i){state.selDay=i;render();/* don't sync selDay — local UI */}
function setFilter(f){state.filter=f;render()}

function editDayTitle(el,dateKey){
  const cur=state.dayTitles[dateKey]||"";
  const input=document.createElement("input");
  input.className="daybar-title-input";
  input.value=cur;
  input.maxLength=30;
  el.replaceWith(input);
  input.focus();
  input.select();
  const commit=()=>{
    const v=input.value.trim();
    if(v)state.dayTitles[dateKey]=v;
    ignoreNext=true;debounceSave();render();
  };
  input.onblur=commit;
  input.onkeydown=e=>{if(e.key==="Enter"){e.preventDefault();commit()}if(e.key==="Escape"){render()}};
}

function dragStart(e,id){dragId=id;e.dataTransfer.setData("text/plain",id);e.dataTransfer.effectAllowed="move"}
function dragEnd(){dragId=null}

function dropCard(e,slotId){
  e.preventDefault();e.currentTarget.classList.remove("over");
  const id=e.dataTransfer.getData("text/plain");if(!id)return;
  const day=DAYS[state.selDay].d;
  SLOTS.forEach(s=>{state.placed[day][s.id]=state.placed[day][s.id].filter(x=>x!==id)});
  if(!state.placed[day][slotId].includes(id))state.placed[day][slotId].push(id);
  ignoreNext=true;debounceSave();render();
}

function rmFromSlot(slotId,actId){
  const day=DAYS[state.selDay].d;
  state.placed[day][slotId]=state.placed[day][slotId].filter(x=>x!==actId);
  ignoreNext=true;debounceSave();render();
}

function delActivity(id){
  if(!confirm("Delete this activity from the planner?"))return;
  state.acts=state.acts.filter(a=>a.id!==id);
  DAYS.forEach(d=>{SLOTS.forEach(s=>{state.placed[d.d][s.id]=state.placed[d.d][s.id].filter(x=>x!==id)})});
  ignoreNext=true;debounceSave();render();
}

function editActivity(id){
  const a=state.acts.find(x=>x.id===id);
  if(!a)return;
  const esc=v=>(v||"").replace(/"/g,"&quot;").replace(/</g,"&lt;");
  const bg=document.createElement("div");bg.className="modal-bg";bg.onclick=e=>{if(e.target===bg)bg.remove()};
  bg.innerHTML=`<div class="modal">
    <h3>Edit Activity</h3>
    <div class="modal-fields">
      <input id="me-title" placeholder="Name" value="${esc(a.title)}">
      <input id="me-sub" placeholder="Location" value="${esc(a.sub)}">
      <textarea id="me-desc" placeholder="Description" rows="2">${esc(a.desc)}</textarea>
      <input id="me-notes" placeholder="Notes" value="${esc(a.notes||"")}">
      <input id="me-who" placeholder="Who? (e.g. Sam &amp; George only)" value="${esc(a.who||"")}">
      <select id="me-cat">${Object.keys(CATS).map(k=>`<option value="${k}"${a.cat===k?" selected":""}>${k.charAt(0).toUpperCase()+k.slice(1)}</option>`).join("")}</select>
      <select id="me-area">${Object.entries(AREAS).map(([k,v])=>`<option value="${k}"${a.area===k?" selected":""}>${v}</option>`).join("")}</select>
      <div class="modal-btns">
        <button class="mbtn-cancel" onclick="this.closest('.modal-bg').remove()">Cancel</button>
        <button class="mbtn-ok" onclick="saveEditActivity('${a.id}')">Save</button>
      </div>
    </div>
  </div>`;
  document.body.appendChild(bg);
}

function saveEditActivity(id){
  const a=state.acts.find(x=>x.id===id);
  if(!a)return;
  const t=document.getElementById("me-title").value.trim();
  if(!t)return;
  a.title=t;
  a.sub=document.getElementById("me-sub").value.trim();
  a.desc=document.getElementById("me-desc").value.trim();
  a.notes=document.getElementById("me-notes").value.trim()||undefined;
  a.who=document.getElementById("me-who").value.trim()||undefined;
  a.cat=document.getElementById("me-cat").value;
  a.area=document.getElementById("me-area").value;
  ignoreNext=true;debounceSave();render();
  document.querySelector(".modal-bg")?.remove();
}

function saveComment(slotId,val){
  const day=DAYS[state.selDay].d;
  if(!state.comments[day])state.comments[day]={};
  state.comments[day][slotId]=val;
  ignoreNext=true;debounceSave();
}

async function resetAll(){
  if(!confirm("Reset the entire planner to defaults? All placements and notes will be lost."))return;
  state=makeDefault();
  ignoreNext=true;await saveState();render();
}

function showAddModal(){
  const bg=document.createElement("div");bg.className="modal-bg";bg.onclick=e=>{if(e.target===bg)bg.remove()};
  bg.innerHTML=`<div class="modal">
    <h3>Add Activity</h3>
    <div class="modal-fields">
      <input id="ma-title" placeholder="Name">
      <input id="ma-sub" placeholder="Location">
      <textarea id="ma-desc" placeholder="Description" rows="2"></textarea>
      <input id="ma-notes" placeholder="Notes">
      <select id="ma-cat">${Object.keys(CATS).map(k=>`<option value="${k}">${k.charAt(0).toUpperCase()+k.slice(1)}</option>`).join("")}</select>
      <select id="ma-area">${Object.entries(AREAS).map(([k,v])=>`<option value="${k}">${v}</option>`).join("")}</select>
      <div class="modal-btns">
        <button class="mbtn-cancel" onclick="this.closest('.modal-bg').remove()">Cancel</button>
        <button class="mbtn-ok" onclick="addActivity()">Add</button>

    </div>
  </div>`;
  document.body.appendChild(bg);

function addActivity(){
  const t=document.getElementById("ma-title").value.trim();
  if(!t)return;
  state.acts.push({id:"c-"+Date.now(),title:t,
    sub:document.getElementById("ma-sub").value.trim(),
    desc:document.getElementById("ma-desc").value.trim(),
    cat:document.getElementById("ma-cat").value,
    notes:document.getElementById("ma-notes").value.trim()||undefined,
    area:document.getElementById("ma-area").value});
  ignoreNext=true;debounceSave();render();
  document.querySelector(".modal-bg")?.remove();
}

// ─── PHOTOS ─────────────────────────────────────────────────

async function uploadPhotos(event,dateKey){
  const files=event.target.files;
  if(!files||!files.length)return;
  const statusEl=document.getElementById("upload-status");
  if(statusEl)statusEl.textContent="Uploading…";

  for(const file of files){
    const ext=file.name.split(".").pop()||"jpg";
    const path=`${dateKey}/${Date.now()}-${Math.random().toString(36).slice(2,6)}.${ext}`;
    try{
      const{data,error}=await sb.storage.from(BUCKET).upload(path,file,{cacheControl:"3600",upsert:false});
      if(error)throw error;
      const{data:urlData}=sb.storage.from(BUCKET).getPublicUrl(path);
      if(!state.photos[dateKey])state.photos[dateKey]=[];
      state.photos[dateKey].push({url:urlData.publicUrl,path:path,name:file.name});
    }catch(e){
      console.error("Upload error:",e);
      if(statusEl)statusEl.textContent="Upload failed: "+e.message;
      return;
    }
  }
  ignoreNext=true;await saveState();render();
}

async function deletePhoto(dateKey,index){
  if(!confirm("Remove this photo?"))return;
  const photo=state.photos[dateKey][index];
  if(photo&&photo.path){
    try{await sb.storage.from(BUCKET).remove([photo.path])}catch(e){console.error("Delete error:",e)}
  }
  state.photos[dateKey].splice(index,1);
  ignoreNext=true;debounceSave();render();
}

function viewPhoto(url){
  const v=document.createElement("div");v.className="photo-viewer";v.onclick=()=>v.remove();
  v.innerHTML=`<img src="${url}" onclick="event.stopPropagation()">`;
  document.body.appendChild(v);
}

// ─── INIT ───────────────────────────────────────────────────
if("serviceWorker" in navigator){navigator.serviceWorker.register("sw.js").catch(()=>{})}
loadState();
</script>
</body>
